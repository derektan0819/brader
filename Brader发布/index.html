      $("#bOut").onclick=downloadBackup;
      if($("#bPaste")) $("#bPaste").onclick=pasteRestore;
      $("#bIn").onchange=e=>restoreFile(e.target.files[0]);
    }});
}
function downloadBackup(){
  const prevBk=S.lastBackup; S.lastBackup=today(); save(); const json=JSON.stringify({S,goals:GOALS},null,1), fn="财务目标备份-"+today()+".json";
  const undo=msg=>{ S.lastBackup=prevBk; save(); if(msg) toast(msg,"err"); };
  const done=msg=>{ obSet("bk",dataSig()); toast(msg); closeSheet(); render(); };
  const saveFile=()=>{ const blob=new Blob([json],{type:"application/json"}), a=document.createElement("a"), url=URL.createObjectURL(blob); a.href=url; a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),30000); done("备份已下载"); };
  if(window.claude&&typeof window.claude.use==="function"){
    // inside the claude.ai link the page cannot start a download itself; the downloads capability asks the viewer instead
    (async()=>{ let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
      if(!dl) return undo("这里下载不了备份");
      try{ await dl.save({filename:fn,data:json}); done("备份已下载"); }catch(e){ undo(e&&e.code==="declined"?"没有下载":"现在下载不了，等一下再试"); } })();
    return; }
  // iPhone：用系统的分享菜单「存储到文件」，主屏幕 App 里也能用
  if(IOS&&navigator.share&&navigator.canShare&&typeof File==="function"){ let f=null; try{ f=new File([json],fn,{type:"application/json"}); }catch(e){}
    if(f&&navigator.canShare({files:[f]})){ navigator.share({files:[f]}).then(()=>done("备份已保存")).catch(e=>{ if(e&&e.name==="AbortError") undo(); else saveFile(); }); return; } }
  saveFile();
}
function applyBackup(d){ if(!d||!Array.isArray(d.goals)) throw 0; const gs=d.goals.map(norm); S=Object.assign(S,d.S||{}); GOALS=gs; save(); obSet("bk",dataSig()); closeSheet(); toast("已还原 "+GOALS.length+" 个目标"); go("overview"); }
function restoreFile(f){ if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ applyBackup(JSON.parse(r.result)); }catch(err){ toast("这个文件不是备份文件","err"); } }; r.readAsText(f); }

/* ================= Confetti (Magic UI): milestone bursts, fireworks when a goal is completed ================= */
const CF={P:[],raf:0};
function burstAt(x,y,n,power){
  const c=$("#confetti"); if(c.hidden){ c.hidden=false; c.width=innerWidth; c.height=innerHeight; }
  const cols=["#37D9E8","#9675FF","#3DD68C","#F5C451","#FF6BD5","#F1F5FF"];
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=(Math.random()*.7+.3)*power;
    CF.P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-power*.35,s:Math.random()*5+3,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,k:Math.random()<.35,life:0}); }
  if(!CF.raf) CF.raf=requestAnimationFrame(cfTick);
}
function cfTick(){
  const c=$("#confetti"), ctx=c.getContext("2d"); ctx.clearRect(0,0,c.width,c.height);
  CF.P=CF.P.filter(p=>p.life<130);
  CF.P.forEach(p=>{ p.life++; p.vy+=.26; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=.12; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=Math.max(0,1-p.life/130); ctx.fillStyle=p.c;
    if(p.k){ ctx.beginPath(); for(let j=0;j<5;j++){ const a=j*Math.PI*.8; ctx.lineTo(Math.cos(a)*p.s*.75,Math.sin(a)*p.s*.75); } ctx.closePath(); ctx.fill(); } else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
  if(CF.P.length) CF.raf=requestAnimationFrame(cfTick); else { CF.raf=0; ctx.clearRect(0,0,c.width,c.height); c.hidden=true; }
}
function milestoneBurst(x,y){ if(fxOn()) burstAt(x,y,70,9); }
function celebrate(){
  if(REDUCE.matches) return;
  if(!fxOn()){ burstAt(innerWidth/2,innerHeight*.38,110,11); return; }
  [[.5,.35,0],[.22,.45,260],[.78,.45,420],[.5,.28,650]].forEach(([fx,fy,d])=>setTimeout(()=>burstAt(innerWidth*fx,innerHeight*fy,90,12),d));
}

/* ================= backdrop: Particles (Magic UI) + Light Rays ================= */
const PT={raf:0,stars:[],W:0,H:0,mx:0,my:0,tx:0,ty:0,bound:false};
function particles(){
  const c=$("#stars"); if(!c||!c.getContext) return; const ctx=c.getContext("2d");
  const PC=LIGHT?{w:"70,86,125",c:"10,127,143",p:"102,67,224",k:.75}:{w:"235,242,255",c:"55,217,232",p:"150,117,255",k:1}; // star colours for the theme
  cancelAnimationFrame(PT.raf); PT.raf=0;
  const size=()=>{ const dpr=Math.min(2,window.devicePixelRatio||1); PT.W=innerWidth; PT.H=innerHeight; c.width=Math.round(PT.W*dpr); c.height=Math.round(PT.H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); };
  const still=()=>{ size(); ctx.clearRect(0,0,PT.W,PT.H); let seed=11; const r=()=>(seed=(seed*16807)%2147483647)/2147483647; const n=Math.round(Math.min(150,PT.W*PT.H/9000));
    for(let i=0;i<n;i++){ const x=r()*PT.W, y=r()*PT.H, z=r(), a=.1+r()*.32, k=r(); ctx.beginPath(); ctx.arc(x,y,.35+z*.95,0,6.283); ctx.fillStyle=`rgba(${k<.12?PC.p:k<.28?PC.c:PC.w},${(a*PC.k).toFixed(2)})`; ctx.fill(); } };
  const mk=()=>{ const z=Math.random(); return {x:Math.random()*PT.W,y:Math.random()*PT.H,z,r:.35+z*1.35,a:(.3+Math.random()*.65)*PC.k,tw:Math.random()*6.28,sp:.008+Math.random()*.02,vy:-(.03+z*.09),
    col:Math.random()<.14?PC.p:Math.random()<.3?PC.c:PC.w}; };
  const frame=()=>{ ctx.clearRect(0,0,PT.W,PT.H); PT.mx+=(PT.tx-PT.mx)*.05; PT.my+=(PT.ty-PT.my)*.05;
    for(const s of PT.stars){ s.tw+=s.sp; s.y+=s.vy; if(s.y<-4){ s.y=PT.H+4; s.x=Math.random()*PT.W; }
      const px=s.x+PT.mx*s.z*26, py=s.y+PT.my*s.z*26, al=s.a*(.55+.45*Math.sin(s.tw));
      if(s.r>1.2){ ctx.beginPath(); ctx.arc(px,py,s.r*3.2,0,6.283); ctx.fillStyle=`rgba(${s.col},${(al*.12).toFixed(3)})`; ctx.fill(); }
      ctx.beginPath(); ctx.arc(px,py,s.r,0,6.283); ctx.fillStyle=`rgba(${s.col},${al.toFixed(3)})`; ctx.fill(); } };
  const loop=()=>{ frame(); PT.raf=requestAnimationFrame(loop); };
  if(!PT.bound){ PT.bound=true; let t;
    addEventListener("resize",()=>{ clearTimeout(t); t=setTimeout(particles,150); });
    addEventListener("pointermove",e=>{ PT.tx=(e.clientX/Math.max(1,PT.W)-.5)*-2; PT.ty=(e.clientY/Math.max(1,PT.H)-.5)*-2; },{passive:true});

/* ================= cloud sync =================
   Opened as the claude.ai link: the data lives in the viewer's own private db document (data/users/<id>/planner)
   and follows them across phone and computer. Opened as a local file (no window.claude): everything stays in this
   browser's localStorage exactly as before. Last writer wins; this browser's copy is kept as a cache. */
let CLOUD=null, CLOUD_STATE=window.claude&&typeof window.claude.use==="function"?"connecting":"local";
let PENDING=null, NEED_RENDER=false, pushTimer=0, pushing=false, dirtyEarly=false, everSynced=false;
const KNOWN=[]; // canonical copies of the states this page wrote or applied, so its own echoes are ignored
const remember=c=>{ if(!KNOWN.includes(c)){ KNOWN.push(c); if(KNOWN.length>8) KNOWN.shift(); } };
const canon=v=>Array.isArray(v)?"["+v.map(canon).join(",")+"]":v&&typeof v==="object"?"{"+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+":"+canon(v[k])).join(",")+"}":JSON.stringify(v===undefined?null:v);
const stateObj=()=>JSON.parse(JSON.stringify({S,goals:GOALS}));
function storageNote(){ return CLOUD_STATE==="synced"?"资料存在你的 claude.ai 账号里，手机和电脑会自动同步。":CLOUD_STATE==="connecting"?"正在连接云端，先显示这个浏览器里的资料。":CLOUD_STATE==="offline"?"云端暂时连不上，这次的改动可能只存在这个浏览器。":"资料只存在这台设备的浏览器里，记得在「备份与恢复」下载备份。"; }
function busy(){ if($("#shade")) return true; const a=document.activeElement; return !!(a&&a!==document.body&&a.closest&&a.closest("#main")&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
function softRender(){ if(busy()){ NEED_RENDER=true; return; } NEED_RENDER=false; render(); }
function flushPending(){ if(busy()) return; if(PENDING){ const p=PENDING; PENDING=null; applyRemote(p); } else if(NEED_RENDER){ softRender(); } }
document.addEventListener("focusout",()=>setTimeout(flushPending,0));
function cloudPush(){ if(!CLOUD){ if(!everSynced&&CLOUD_STATE!=="local") dirtyEarly=true; return; } clearTimeout(pushTimer); pushTimer=setTimeout(flushPush,600); }
async function flushPush(){
  if(!CLOUD) return;
  if(pushing){ clearTimeout(pushTimer); pushTimer=setTimeout(flushPush,400); return; }
  const body=stateObj(), c=canon(body);
  if(KNOWN[KNOWN.length-1]===c) return;
  pushing=true; remember(c);
  for(let attempt=0;attempt<2;attempt++){
    try{ await CLOUD.ref.set(body); break; }
    catch(e){ const code=e&&e.code;
      if(code==="unavailable"&&attempt===0){ await new Promise(r=>setTimeout(r,700+Math.random()*700)); continue; }
      toast(code==="quota_exceeded"||code==="invalid_argument"?"资料太大，云端存不下了，先下载备份":"云端暂时存不了，改动先留在这个浏览器","err");
      CLOUD_STATE="offline"; softRender(); break; }
  }
  pushing=false;
}
function applyRemote(body){
  const c=canon(body); if(KNOWN.includes(c)) return;
  if(busy()){ PENDING=body; return; }
  PENDING=null; remember(c); dropUndo();
  S=Object.assign({income:0,expense:0,debt:0,age:30,job:"auto"},body.S||{}); GOALS=(Array.isArray(body.goals)?body.goals:[]).map(norm);
  try{ localStorage.setItem(KEY,JSON.stringify({S,goals:GOALS})); }catch(e){}
  NEED_RENDER=false; render();
}
async function initCloud(){
  if(CLOUD_STATE!=="connecting") return;
  let db=null,user=null,uidv=null,ref=null;
  try{ [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]); if(user) uidv=await user.id(); }catch(e){}
  try{ if(db&&uidv) ref=db.doc("data/users/"+uidv+"/planner"); }catch(e){ ref=null; }
  if(!ref){ CLOUD_STATE="local"; softRender(); return; }
  const timer=setTimeout(()=>{ if(!everSynced){ CLOUD_STATE="offline"; softRender(); } },10000);
  ref.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return; // this page's own write, not yet confirmed
    const definitive=!snap.metadata.fromCache;
    if(snap.exists){
      if(!everSynced&&dirtyEarly&&definitive) toast("已载入云端的资料，刚才的改动请再做一次","info");
      applyRemote(JSON.parse(JSON.stringify(snap.data()||{}))); // delivered bodies are frozen: work on a copy
    }
    if(definitive&&!everSynced){
      everSynced=true; clearTimeout(timer); CLOUD={ref}; CLOUD_STATE="synced";
      if(!snap.exists&&(GOALS.length||S.income||S.expense||dirtyEarly)) flushPush(); // first visit: carry this browser's data up
      dirtyEarly=false; softRender();
    } else if(definitive&&CLOUD_STATE!=="synced"){ CLOUD_STATE="synced"; softRender(); }
  }, ()=>{ clearTimeout(timer); CLOUD=null; CLOUD_STATE="offline"; softRender(); });
}

const PAGE_KEYS=["overview","goals","ask","done","paused"];
function openKeys(){
  const K=[["N","新目标"],["U","更新进度（在目标页面）"],["1 – 5","总览、我的目标、问 Brader、成就墙、暂停中的目标"],["/","找题目（问 Brader）"],["H","遮住 / 显示金额"],["T","深色 / 浅色主题"],[MAC?"⌘ Z":"Ctrl Z","撤销刚才的存入、取出、删除记录"],["?","打开这个说明"],["Esc","关掉窗口"]];
  modal({title:"快捷键",sub:"在输入框里打字的时候，这些键不会触发。",body:`<dl class="keys">${K.map(([k,d])=>`<dt>${k.split(" ").filter(x=>x).map(x=>x==="–"?"–":`<kbd>${x}</kbd>`).join("")}</dt><dd>${d}</dd>`).join("")}</dl>`,
    foot:`<button class="btn pri" type="button" id="kOk">知道了</button>`,focus:"#kOk",onMount:()=>{ $("#kOk").onclick=closeSheet; }}); }
document.addEventListener("keydown",e=>{
  if(e.defaultPrevented||e.isComposing||e.altKey) return;
  const t=e.target, typing=!!(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)));
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&(e.key==="z"||e.key==="Z")){ if(!typing&&!$("#shade")&&UNDO){ e.preventDefault(); doUndo(); } return; }
  if(e.metaKey||e.ctrlKey||typing||$("#shade")||MENU) return;
  const k=e.key||"";
  if(k==="?"){ e.preventDefault(); setDrawer(false); openKeys(); return; }
  if(e.shiftKey) return;
  if(k==="/"){ e.preventDefault(); if(VIEW.page!=="ask") go("ask"); const f=$("#qFind"); if(f){ f.focus(); f.select(); } return; }
  const num=/^Digit[1-5]$/.test(e.code||"")?+e.code.slice(5):/^[1-5]$/.test(k)?+k:0;
  if(num){ e.preventDefault(); go(PAGE_KEYS[num-1]); return; }
  const key=k.toLowerCase();
  if(key==="n"){ e.preventDefault(); setDrawer(false); openAdd(""); }
  else if(key==="u"){ e.preventDefault(); const g=VIEW.page==="goal"?GOALS.find(x=>x.id===VIEW.id):null; if(g&&g.status!=="done") openUpdate(g); else toast("先打开一个进行中的目标，再按 U","info"); }
  else if(key==="h"){ e.preventDefault(); setHide(!HIDE); }
  else if(key==="t"){ e.preventDefault(); setTheme(!LIGHT,$("#themeBtn")); }
});
// printing: open every section so nothing is folded away, then put them back
let PRINT_OPEN=null;
addEventListener("beforeprint",()=>{ PRINT_OPEN=[...document.querySelectorAll("details.sec")].map(d=>[d,d.open]); PRINT_OPEN.forEach(([d])=>{ d.open=true; }); });
addEventListener("afterprint",()=>{ if(PRINT_OPEN) PRINT_OPEN.forEach(([d,o])=>{ d.open=o; }); PRINT_OPEN=null; });

document.documentElement.lang="zh-CN";
applyTheme(); applyHide(); applyFX(); particles(); lightRays();
if(REDUCE.addEventListener) REDUCE.addEventListener("change",()=>{ applyFX(); particles(); render(); });
$("#scrim").onclick=()=>setDrawer(false);
if(window.matchMedia) matchMedia("(min-width:961px)").addEventListener("change",e=>{ if(e.matches&&DRAWER) setDrawer(false); });
render();
initCloud();
watchFX();
})();
</script>
</body>
