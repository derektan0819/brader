{id:"tax",cat:"prot",needs:"",q:"我怎样合法少交一点税？",kw:"税 扣税 tax relief 报税 PRS SSPN 退税 tax refund 所得税",rel:["ins","edu","retire"],
 params:[{k:"br",l:"你的所得税税率（tax bracket）",u:"%",d:()=>25,max:40,step:1,hint:"例子用 25%"}],
 ans:(c,P)=>{ const t=P.br/100;
  return {open:"很多人一直在寻找高回报率的投资，却忘了其实有一种回报比投资更直接，而且是包赚的，它就是 tax relief。",
   tool:{t:"常见的扣税项目",h:tTable(["项目","一年最多"],[["PRS","RM3,000"],["SSPN（孩子教育储蓄）","RM8,000"],["EPF（含自愿供款）和人寿保险","大约 RM4,000 和 RM3,000"],["Lifestyle","大约 RM2,500"]],-1)},
   calc:[`以 ${P.br}% 的税率算：PRS 放 RM3,000，扣税 ${B(3000*t)}；SSPN 放 RM8,000，扣税 ${KB(8000*t)}。等于马上拿到 ${P.br}% 的回报，还没算产品本身的回报。`],
   fork:"不知道自己的税率？看去年的报税单（e-Filing），或者上 moneybrader.com 的 tax 页面自己算。",
   re:"大家都在找高回报，其实扣税就是包赚的回报。所以在理财顺序里，投资前先把扣税额用满。",
   so:"所以，年尾第一件事，是把 tax relief 用满；拿到 tax refund，先补救命的钱，再拿去投资。",
   acts:[]}; }},
{id:"raise",cat:"flow",needs:"",q:"我加薪了，多出来的钱应该怎么用？",kw:"加薪 bonus 花红 多出来 lifestyle inflation 50% 法则 涨薪",rel:["split","million","start"],
 params:[{k:"r",l:"每个月加了多少",u:"RM",d:()=>500,min:1}],
 ans:(c,P)=>{ const half=P.r/2, yrs=Math.max(5,60-c.A), f=fv(0,half,mrate(.07),yrs*12);
  return {open:"恭喜你！不过加薪的时候，也是最容易掉进陷阱的时候。",
   tool:{t:"50% 加薪法则",h:tFml("加的薪水 = 50% 提高生活 + 50% 拿去投资")},
   calc:[`你加了 ${rm(P.r)}：${B(half)} 拿去提高生活，${B(half)} 拿去投资。每个月多投 ${rm(half)}，7% 回报，${yrs} 年后大约是 ${KB(f,1)}。`],
   fork:"拿到 bonus 也一样：最多一半用来提高生活，另外一半拿去投资或储蓄。",
   re:"很多人薪水从 5,000 涨到 10,000，但是贷款、消费也一直增加，其实财富根本没有增加。这就是 lifestyle inflation。",
   so:"所以，加薪那个月，马上把一半 set 成 auto debit 去投资，看不到就不会花。",
   acts:[]}; }},
{id:"start",cat:"inv",needs:"",q:"我还年轻，钱也不多，可以迟一点才开始投资吗？",kw:"开始投资 什么时候 迟一点 年轻 钱不多 越早越好 复利 小花 巴菲特",rel:["million","fear","ef"],
 params:[{k:"m",l:"每个月可以投资",u:"RM",d:()=>300,min:1}],
 ans:(c,P)=>{ const yrs=Math.max(1,60-c.A), now=fv(0,P.m,mrate(.08),yrs*12), late=yrs>10?fv(0,P.m,mrate(.08),(yrs-10)*12):0;
  return {open:"你我和巴菲特最大的区别：巴菲特十一岁就开始投资了。投资最重要的变量，是时间。",
   tool:{t:"两个人比一比（假设回报 8%）",h:tTable(["","什么时候开始","本金","65 岁有"],[["小花","25 岁，每年 RM5,000，只投十年","RM50,000","RM787,000"],["小明","35 岁，每年 RM5,000，投三十年","RM150,000","RM611,000"]],0)},
   calc:[`你今年 ${c.A} 岁，每个月投 ${rm(P.m)}，8% 回报，到 60 岁大约有 ${KB(now,1)}。${late?`迟十年才开始，只有 ${B(late,1)}，少了 ${B(now-late,1)}。`:""}`],
   fork:efFull()?"你的救命的钱已经存好了，今天就可以开始。":"前提是救命的钱先存好；存够了，就不要再等。",
   re:"「钱才一千块，赚 10% 也才一百块，等有钱再投资。」如果你连一千块的投资习惯都还没养成，凭什么你觉得有 100k 的时候你就会去投资？",
   so:"所以，存好救命的钱之后，今天就开始，哪怕一天十块。投资其实就是一种习惯，和你的能力没有关系。",
   acts:efFull()?[]:[{l:c.efGoals.length?"查看我的救命的钱":"先建立救命的钱",pri:!c.efGoals.length,f:()=>c.efGoals.length?go("goal",c.efGoals[0].id):openAdd("存够救命的钱")}]}; }},
{id:"fear",cat:"inv",needs:"",q:"我很怕投资会亏钱，怎么办？",kw:"怕亏 亏钱 风险 股票 波动 赌博 ETF S&P 500 安全",rel:["start","flexi","million"],
 ans:c=>{ const act=activeSorted().slice(0,4);
  return {open:"怕亏钱是正常的。不过先分清楚，你怕的是短期的上上下下，还是长期真的会亏。",
   tool:{t:"对照表：投资 S&P 500，亏钱的概率",h:tTable(["投资多久","亏钱的概率"],[["一天","46%，跟赌大小没什么分别"],["坚持十年","大约 6%"]],1)+tNote("Bloomberg 从 1929 年起的数据。这是 ETF 大盘，不是个股：炒股票，很可能是太阳下山后，永远都看不到日出。")},
   calc:act.length?[`所以要看这笔钱什么时候要用。你现在的目标是这样放的：`+tTable(["目标","截止","放哪里"],act.map(g=>[esc(g.name),ymLabel(g.deadline),OPTS[optOf(g)].name]),-1)]
     :["所以要看这笔钱什么时候要用：一年内要用的放 MMF；一到三年放债券；三到五年股票、债券一半一半；五年以上才放股票 ETF。"],
   fork:"",
   re:"风险是可以被时间冲淡的。真正的损失，是短期要用的钱放股票，跌了又没时间等反弹，被逼在亏损的时候卖掉。",
   so:"所以，五年以上才用的钱放 ETF 大盘，短期要用的钱放 MMF 或债券；不要去炒个股。",
   acts:act.length?[{l:"看我的目标",f:()=>go("goals")}]:[]}; }},
{id:"couple",cat:"family",needs:"I",q:"结婚后，夫妻的钱应该分开还是一起管？",kw:"夫妻 结婚 老公 老婆 另一半 joint account 私房钱 吵架 谈钱 情侣",rel:["split","edu","ins"],
 params:[{k:"p",l:"另一半的每月净收入",u:"RM",d:()=>0},{k:"own",l:"各自每月零用钱",u:"RM",d:()=>1000,hint:"例子是各两千，照你们的情况定"}],
 ans:(c,P)=>{ const T=c.I+P.p, joint=T-2*P.own;
  return {open:"很多夫妻一谈钱就吵架，不是因为钱不够，是因为没有方法、没有 plan 去谈。",
   tool:{t:"Brader 的做法",h:tSteps(["一起做一份消费预算：两个人的收入、重要开销（包括一年一次的大开销）、想存多少","共同开销、储蓄、投资放 joint account，自动转","各自一张 debit card，每月固定一笔零用钱，不需要交代"])},
   calc:P.p>0?[`两个人一共 ${B(T)}。各自留 ${rm(P.own)} 零用钱，其余 ${B(Math.max(0,joint))} 进 joint account；里面至少 ${KB(T*.2)}（20%）自动转去储蓄和投资。`]
     :[`先在上面填另一半的收入，我帮你们一起算。以你自己的 ${rm(c.I)} 来说，至少 ${KB(c.I*.2)}（20%）要自动转去储蓄和投资。`],
   fork:"开场可以这样讲：「我想把你放进我的理财计划里面，因为你是我人生最重要的一项规划。」",
   re:"手指指自己，不要指外面，你指外面就是吵架了。而且我很鼓励老公老婆都要有自己的私房钱。",
   so:"所以，一起做预算，共同的钱从 joint account 自动转，各自留一笔不用交代的私房钱。",
   acts:[]}; }},
{id:"layoff",cat:"save",needs:"E",q:"如果我明天被裁员，我的钱撑得了多久？",kw:"裁员 失业 没工作 撑多久 跑道 runway 被炒 retrench",rel:["ef","dsr","ins"],
 params:[{k:"cash",l:"现金、存款、EPF、股票加起来",u:"RM",d:()=>Math.round(GOALS.filter(g=>g.status!=="done").reduce((a,g)=>a+g.saved,0)),hint:"先用你所有目标存了的钱，可以改"}],
 ans:(c,P)=>{ const run=P.cash/c.E, runTxt=(run>=10?Math.round(run):Math.floor(run*10)/10)+" 个月", short=c.efM*c.E-P.cash;
  return {open:"这个问题，最好在还没被裁员之前就算好。",
   tool:{t:"公式：总存款 ÷ 每月支出 = 还能撑几个月",h:tFml("总存款 ÷ 每月支出 = 还能撑几个月")+tNote("Brader 的 3 天法则：72 小时内把现金、存款、EPF、股票加起来，再列每月固定支出（一年一次的保险、孩子开学费用也摊进去）。")},
   calc:[`${rm(P.cash)} ÷ 每月支出 ${B(c.E)} = 大约 <b class="n kn">${runTxt}</b>。`],
   fork:(run>=c.efM?`够你需要的 ${c.efM} 个月，可以慢慢找合适的工作。`:`你需要 ${c.efM} 个月，还差 ${B(short)}。`)+(c.D>0?` 另外，你的贷款月供 ${B(c.D)} 是不能 cut 的，没收入的时候它最重。`:""),
   re:"就好像你的船沉了，把你带到一个荒岛，你只有一个月的粮食，你要如何把这一个月的粮食，分配到六个月？不知道这个数字，你会很拖，或者很焦虑。",
   so:`所以，现在就把这个数字算出来${run<c.efM?`，不够 ${c.efM} 个月就先把救命的钱存满`:""}；真的被裁员，也不要先砍 medical card，因为你已经没有公司的 group insurance 了。`,
   acts:c.efGoals.length?[]:[{l:"建立救命的钱",pri:1,f:()=>openAdd("存够救命的钱")}]}; }},
{id:"million",cat:"inv",needs:"",q:"我每个月要投资多少，才能变成百万富翁？",kw:"百万富翁 一百万 1 million 每个月投资 多少 复利 一天十块",rel:["start","raise","retire"],
 params:[{k:"y",l:"几年后",u:"年",d:c=>Math.max(5,60-c.A),min:1,max:60,step:1}],
 ans:(c,P)=>{ const n=P.y*12, inv=pmtFor(1e6,0,mrate(.10),n), fd=pmtFor(1e6,0,mrate(.03),n);
  return {open:"成为百万富翁，没有你想象中那么难，关键是时间和复利。",
   tool:{t:"一天存十块钱",h:tFml("一天 RM10 → 一个月 RM300 → 10% 回报、35 年 ≈ 一百万")+tNote("本金只有 RM126,000，其余都是复利。")},
   calc:[`你要 ${P.y} 年后有一百万：拿去投资（假设回报 10%），每个月 ${KB(inv,1)}；只放 FD（3%），每个月要 ${B(fd,1)}，差了 ${(fd/inv).toFixed(1)} 倍。`],
   fork:c.hasI&&c.hasE?(inv>c.sur?`这比你现在的每月盈余 ${B(Math.max(0,c.sur))} 多。可以先从做得到的数目开始，每次加薪，把一半加进去。`:`你现在的每月盈余 ${B(c.sur)} 做得到。`):"",
   re:"投资其实就是一种习惯，和你的能力没有关系。反正十块钱又不是很多，应该不会有什么投资压力吧。",
   so:`所以，每个月自动投资 ${rm(nice(inv))} 到 ETF 大盘，市场跌的时候也不要停。`,
   acts:[{l:"把这个变成目标",pri:1,goal:1,f:()=>openAdd(`${P.y}年后存到一百万`,{name:"第一个一百万",target:1e6,months:n,how:"问 Brader 算的：一百万，五年以上放成长型投资组合"})}]}; }},
/* ---- 第五批（2026-11-20）：从 Kelvin 第二大脑的观点卡加的题。src 是出处（只给自己核对，不显示）；数字都照卡上 Kelvin 自己的例子重算过 ---- */
{id:"minpay",cat:"debt",needs:"I",cx:"I",q:"信用卡只还 minimum payment，可以吗？",src:"观点卡《Minimum payment 陷阱》《还清 statement balance》《卡债转 installment 或 balance transfer》",
 kw:"minimum payment 最低还款 只还最低 只还 5% statement balance outstanding 利息 18% installment balance transfer 还一部分",rel:["cardhelp","card","ccuse"],
 params:[{k:"b",l:"卡债还欠",u:"RM",d:()=>askCardBal()||10000,min:1,main:1,cue:"卡债 欠 信用卡 还欠",hint:"有填还债计划的，先用你的信用卡欠款"},{k:"r",l:"卡债利率（一年）",u:"%",d:()=>18,max:40,step:.5,cue:"利息 利率"}],
 ans:(c,P)=>{ const b=P.b, r=P.r/100, min0=cardMin(b), it0=b*r/12; let bal=b, n=0, int=0; while(bal>.005&&n<900){ const it=bal*r/12; int+=it; bal+=it; bal-=Math.min(bal,cardMin(bal-it)); n++; }
  const inst=b*1.1/24, bt=b*1.15/36;
  return {open:"银行就是要靠你们一直还 minimum payment 来赚钱的。",
   tool:{t:`三种还法比一比：卡债 ${rm(b)}`,h:tTable(["做法","每个月还","多付的利息"],[["只还 minimum payment（欠款 5%，最少 RM50）",rm(min0)+" 起，越还越少",rm(int)],["打去银行转 24 个月 installment（一年大约 5%）",rm(inst),rm(b*.1)],["每个月还清 statement balance","刷多少还多少","RM0"]],1)},
   calc:[`你欠 ${B(b)}，第一个月的 minimum 是 ${B(min0)}，其中 ${B(it0)} 是利息，欠款只减了 ${rm(min0-it0)}。一直只还 minimum，要 ${durTxt(n)}才还完，多付 ${KB(int)} 利息。`],
   fork:c.sur>=inst?`你每月盈余 ${B(c.sur)}，够付 24 个月 installment 的 ${B(inst)}。打去 customer service 问，银行通常不会主动讲出来。`
     :`你每月盈余${c.sur>0?" "+B(c.sur):"不够"}，付不起 24 个月的 ${rm(inst)}。可以问 36 个月的 balance transfer（一年大约 5%），每月大约 ${B(bt)}；还是付不起，看「卡债太多，已经还不起了」那一题。`,
   re:"很多人以为 minimum 就是 5%，其实不是：你还 99% 也是 minimum payment。只要 statement balance 没还清，欠一块钱，银行也会对整个月的消费计算利息。",
   so:"所以，能还清 statement balance 就还清；还不清的，打去银行转 installment，不要只还 minimum。",
   acts:[{l:liveDebts().length?"看我的还债计划":"把卡债加进还债计划",f:()=>go("debt")}]}; }},
{id:"cardhelp",cat:"debt",needs:"IE",cx:"IE",q:"卡债太多，已经还不起了，怎么办？",src:"观点卡《卡债的四种解法》《AKPK》；Kelvin 立场确认表第 17 题（先探索分期，逼不得已才进 AKPK）、第 28 题（1% 到 1.5% 是月供）",
 kw:"还不起 还不完 卡债 太多 akpk dmp 债务重组 personal loan installment balance transfer 破产 bankrupt 盖掉 debt consolidation 止痛药",rel:["minpay","card","nosave"],
 params:[{k:"b",l:"卡债一共欠",u:"RM",d:()=>askCardBal()||30000,min:1,main:1,cue:"卡债 欠 一共",hint:"有填还债计划的，先用你的信用卡欠款"}],
 ans:(c,P)=>{ const b=P.b, s=c.sur, hl=s>=b*.03?0:s>=b*.02?1:s>=b*.01?2:-1;
  return {open:"有效的方式其实就是四种而已，不需要去 social media 找奇奇怪怪的方式。",
   tool:{t:"卡债的四种解法（照这个顺序试）",h:tTable(["解法","年期","每月大约还"],[["转 installment 或 balance transfer","3 到 5 年","欠款的 3%"],["拿 personal loan 盖掉卡债","5 到 7 年","欠款的 2%"],["加入 AKPK 的债务管理计划（DMP）","8 到 10 年","欠款的 1% 到 1.5%"],["Refinance 房子，cash out 还卡债","最多 10 年","看房贷"]],hl)},
   calc:[`你欠 ${B(b)}：转 installment，每月大约 ${B(b*.03)}；personal loan 大约 ${B(b*.02)}；AKPK 大约 ${B(b*.01)} 到 ${rm(b*.015)}。`],
   fork:hl===0?`你每月盈余 ${B(s)}，付得起第一种。先打去银行问 installment 或 balance transfer。`
     :hl>0?`你每月盈余 ${B(s)}，付不起 3%。先问 personal loan；真的逼不得已，才找 AKPK。AKPK 不是 blacklist，也不是破产，只是还清之前很难再申请贷款，卡也会被 cancel。`
     :`你现在每月盈余${s>0?"只有 "+B(s):"是负的"}，连欠款的 1%（${rm(b*.01)}）都付不起。先把最大的开销 cut 下来，再去问 AKPK；拖下去只会越欠越多。`,
   re:"转 installment、借贷款盖掉卡债，只是一个止痛药。真正要治的是病根：为什么每个月都没钱？不然卡还清了，又会刷回来。",
   so:"所以，先问 installment，再考虑 personal loan，真的逼不得已才找 AKPK；同时把信用卡锁起来，改用 debit card。",
   acts:[{l:"做我的还债计划",pri:1,f:()=>go("debt")},{l:"帮我算开销",f:()=>openSpend()}]}; }},
{id:"flat",cat:"debt",needs:"",cx:"",q:"Personal loan 说利率只有 4%，真的便宜吗？",src:"观点卡《Flat Rate 与 Effective Rate》（flat × 1.8 到 1.9 ≈ effective；4% 约 7.2%）",
 kw:"平息 flat rate effective rate 实际利率 eir personal loan 私人贷款 利率 便宜 车贷利息 广告 利息怎么算",rel:["dsr","cardhelp","car"],
 params:[{k:"f",l:"广告上的利率（平息）",u:"%",d:()=>4,min:.1,max:30,step:.1,cue:"利率 利息 平息"},{k:"y",l:"借几年",u:"年",d:()=>5,min:1,max:10,step:1,cue:"借 供 年"},{k:"p",l:"借多少",u:"RM",d:()=>30000,min:1,main:1,cue:"借 贷款"}],
 ans:(c,P)=>{ const f=P.f, y=P.y, p=P.p, pay=p*(1+f/100*y)/(y*12), int=p*f/100*y, e=flatEIR(f,y);
  return {open:"贷款的利率有两种算法，广告上写的，通常是看起来比较便宜的那一种。",
   tool:{t:"Flat rate（平息）和 effective rate（实际利率）",h:tTable(["算法","利息怎么算","常用在"],[["Flat rate 平息","一开始借多少，就一直按多少算，不会随本金减少","personal loan、旧的车贷"],["Effective rate 实际利率","按剩下的本金算，还得越多，利息越少","房贷"]],0)+tNote("快速换算：flat rate × 大约 1.8 到 1.9 ≈ effective rate。比如说 4% 的平息，大约是 7.2% 的实际利率。")},
   calc:[`借 ${B(p)}、${y} 年、平息 ${f}%：每月还 ${B(pay)}，一共付 ${B(int)} 利息。换成实际利率，大约是 <b class="n kn">${e}%</b>。`],
   fork:e>DEBT_HI?`实际利率超过 8%，跟信用卡一样算高利息的债：有闲钱先清它，不要拿这笔钱去投资。`:"实际利率低过 8%，不算高利息的债，照时间还就好。",
   re:"很多人以为「车贷利息比房贷便宜，买车省下的钱拿去还房贷」，这是大错特错。4% 的个人贷款，其实比 5% 的房贷还贵。",
   so:"所以，看贷款不要只看广告上的数字：平息先乘 1.8 到 1.9，才是你真正付的利息。",
   acts:[{l:"把这笔贷款加进还债计划",f:()=>go("debt")}]}; }},
{id:"ccuse",cat:"debt",needs:"I",cx:"I",q:"信用卡应该怎么用，才不会越用越穷？",src:"观点卡《信用卡的正确用法》《信用卡使用率》《用一张 debit card 控制开销》",
 kw:"信用卡 怎么用 正确用法 使用率 utilization 额度 limit cashback point 免息期 50天 debit card 刷卡 annual fee",rel:["minpay","ctos","budget"],
 params:[{k:"lim",l:"信用卡总额度",u:"RM",d:c=>Math.max(1000,Math.round(c.I*3/1000)*1000),min:1,main:1,cue:"额度 limit"}],
 ans:(c,P)=>{ const L=P.lim, hasCard=liveDebts().some(d=>d.kind==="card");
  return {open:"用对了，它是帮助你理财的好工具；用错了，它是让你越来越穷的债务陷阱。",
   tool:{t:"信用卡的正确用法",h:tTable(["做法","标准"],[["每个月还清 statement balance","少还一毛钱都不行"],["不固定的开销用 debit card","信用卡只刷打油、电费这些固定开销"],["使用率（欠款 ÷ 额度）","平时 30% 以下，申请贷款前降到 20%"],["额度","月薪 3 到 6 倍，当最后的救命稻草"]],0)},
   calc:[`你的总额度 ${B(L)}：平时欠款不要超过 ${B(L*.3)}；要申请房贷、车贷之前，降到 ${B(L*.2)} 以下。没还清的话，利息一年 18%，等于一天大约 0.05%。`],
   fork:hasCard?"你现在有卡债。先把信用卡锁在抽屉，不要带出街、不要绑 e-wallet，用 debit card 就好，等还清了再说。"
     :"测试一下自己：你有没有被信用卡的账单吓到过？计划花 RM3,000，账单来了 RM8,000，每两三个月就有一次 surprise，你就不适合用信用卡。",
   re:"你做不到 full payment，就代表你不会理财；不会理财，就不应该再用 credit card。50 天免息期也不是什么秘密，总有一天你欠一块钱，之前的利息银行就赚回来了。",
   so:"所以，每个月还清 statement balance，不固定的开销用 debit card；做不到，就先不要用信用卡。",
   acts:[]}; }},
{id:"ctos",cat:"debt",needs:"",cx:"",q:"我的 CTOS、CCRIS 不好，会怎样？要怎么修？",src:"观点卡《CTOS 与 CCRIS》（RM500,000、35 年：3.6% vs 4.5% 多付约 110K）",
 kw:"ctos ccris 信用 评分 credit score 记录 迟还 late payment 白底 黑名单 blacklist 修复 被拒 reject 借不到 批不到",rel:["ccuse","house","refi"],
 params:[{k:"L",l:"房贷要借多少",u:"RM",d:()=>500000,min:1,main:1,cue:"借 房贷 贷款"},{k:"y",l:"借几年",u:"年",d:()=>35,min:5,max:35,step:1,cue:"年"}],
 ans:(c,P)=>{ const L=P.L, n=P.y*12, p1=lpmt(L,.036/12,n), p2=lpmt(L,.045/12,n), diff=(p2-p1)*n;
  return {open:"银行审批贷款，最常看的就是这两份报告。信用好坏，短期差不多，长期差很多。",
   tool:{t:"银行最常看的两份报告",h:tTable(["报告","是什么"],[["CCRIS","Bank Negara 的资料，记录你过去 12 个月有没有准时还"],["CTOS","私人公司的报告，300 到 850 分：700 以上算很美，低过 600 就很难借"]],-1)+tNote("修复：迟还的马上还清，再等 12 个月让记录 refresh；信用卡欠款降到额度 20% 以下；12 个月内不要申请超过 4 个贷款；想 cut 卡，留下用最久的那一张。借大钱之前，先 print 自己的 CTOS 看一次。")},
   calc:[`同样借 ${B(L)}、${P.y} 年：信用好拿到 3.6%，每月 ${B(p1)}；信用差只拿到 4.5%，每月 ${B(p2)}，一共多付 ${KB(diff,1)}。`],
   fork:"什么记录都没有的「白底」，银行一样不借。刚出来做工的，可以在出粮的银行申请一张没有年费的信用卡，limit 不要太高，用了每个月还清。",
   re:"很多人以为迟还一两次没什么。其实迟还一期大约掉一百分，三个月就掉到四五百分；房贷迟还一两个月，以后都很难再借。",
   so:"所以，每一笔都准时还，信用卡欠款压在额度 30% 以下；要借大钱之前，先自己 print 一次 CTOS。",
   acts:[]}; }},
{id:"refi",cat:"carhouse",needs:"",cx:"",q:"什么时候应该 refinance 房贷？",src:"观点卡《什么时候 refinance》（三种情况、利息至少差 0.5%）",
 kw:"refinance refi 再融资 转贷 房贷 利息 降息 cash out moving cost 律师费 月供 reset",rel:["flexi","ctos","house"],
 params:[{k:"bal",l:"房贷还欠",u:"RM",d:()=>400000,min:1,main:1,cue:"还欠 房贷 欠"},{k:"r0",l:"现在的利率",u:"%",d:()=>4.5,max:15,step:.05,cue:"现在 原本"},{k:"r1",l:"新的利率",u:"%",d:()=>4,max:15,step:.05,cue:"新 换 转"},{k:"y",l:"还剩几年",u:"年",d:()=>30,min:1,max:35,step:1,cue:"剩 还有"}],
 ans:(c,P)=>{ const n=P.y*12, p0=lpmt(P.bal,P.r0/1200,n), p1=lpmt(P.bal,P.r1/1200,n), dr=Math.round((P.r0-P.r1)*100)/100, tot=(p0-p1)*n;
  return {open:"如果不是以下三种情况，最好不要 refinance。",
   tool:{t:"只有三种情况，才值得 refinance",h:tSteps(["要 cash out 去还高利息的卡债（拿去消费就不要）","想省利息：利息至少差 0.5%（比如 4.5% 换 4%）","现金流出问题，想降低月供缓一缓气"],dr>=.5?1:-1)},
   calc:dr>0?[`还欠 ${B(P.bal)}、剩 ${P.y} 年：${P.r0}% 每月 ${B(p0)}，${P.r1}% 每月 ${B(p1)}，每个月少 ${B(p0-p1)}，${P.y} 年一共大约少付 ${KB(tot,1)}。`]
     :[`新的利率 ${P.r1}% 没有比现在的 ${P.r0}% 低。为了省利息去 refinance，只会多付 moving cost。`],
   fork:dr>=.5?`利息差 ${dr}%，${dr>.5?"超过":"刚好到"} 0.5%，可以去问。记得问清楚：贷款期限会不会被 reset，律师费、估价这些 moving cost 要多少。`
     :dr>0?`利息只差 ${dr}%，还不到 0.5%。加上 moving cost，贷款期限又被 reset，很可能不划算。`:"",
   re:"很多人以为 zero moving cost 就是免费，其实只是羊毛出在羊身上：那些费用被加进你的贷款里面了。",
   so:"所以，不是这三种情况，就不要 refinance；想省利息，至少要差 0.5%。",
   acts:[]}; }},
{id:"carkeep",cat:"spend",needs:"",cx:"",q:"车要驾几年才换，比较划算？",src:"观点卡《车驾越久越划算》（Honda City RM90,000：驾五年每年约 RM8,967、十年约 RM6,200；维修费不超过车价 5%）",
 kw:"换车 驾几年 几年换 新车 旧车 二手车 贬值 折旧 depreciation 维修 卖车 upgrade 换 tesla",rel:["car","carhouse","impulse"],
 params:[{k:"p",l:"车价",u:"RM",d:()=>90000,min:1,main:1,cue:"车价 车 买"}],
 ans:(c,P)=>{ const p=P.p, y5=p*8967/90000, y10=p*6200/90000;
  return {open:"「每三到五年就应该换一辆新车」，其实是拥有汽车最昂贵的方式。",
   tool:{t:"Honda City RM90,000：驾越久，每年的成本越低",h:tTable(["驾几年才换","每年大约花"],[["驾 3 年就换","一万多"],["驾 5 年","大约 RM8,967"],["驾 10 年","大约 RM6,200"]],2)+tNote("新车一落地马上掉 20%，接下来每年掉 10% 到 15%，第五年只剩一半；第六、七、八年之后，每年只贬值三到五千。")},
   calc:[`你的车 ${B(p)}，照这个例子按比例算：驾五年，每年大约 ${B(y5,1)}；驾十年，每年大约 ${B(y10,1)}，一年少花 ${KB(y5-y10,1)}。`],
   fork:`车驾久了也会有维修。每年的维修费不超过车价 5%（${B(p*.05)}），就继续驾。`,
   re:"很多人驾了四年，怕以后卖不值钱就想换。其实车开越久越划算，Brader 自己的车驾了九到十年都没换。",
   so:"所以，买车就打算驾七到十年（至少八年）才换；维修费没超过车价 5%，就不要急着换。",
   acts:[]}; }},
{id:"savins",cat:"prot",needs:"",cx:"I",q:"储蓄保险、投资型保单，值得买吗？",src:"观点卡《储蓄保险不值得买》《Buy term, invest the rest》（每年 RM1,800、10%、二十五年约 RM177,000）；Kelvin 立场确认表第 25 题",
 kw:"储蓄保险 投资型保险 investment linked ilp savings plan 保单 cash value 退休保险 教育保险 buy term invest the rest 定期人寿 保险 投资 值得",rel:["ins","medcard","utfee"],
 params:[{k:"d",l:"投资型保单每年多付的保费",u:"RM",d:()=>1800,min:1,main:1,cue:"保费 多付 每年"},{k:"yrs",l:"供几年",u:"年",d:()=>25,min:1,max:50,step:1,cue:"供 年"}],
 ans:(c,P)=>{ const f10=fv(0,P.d,.10,P.yrs), f3=fv(0,P.d,.03,P.yrs);
  return {open:"我认为没有人应该买储蓄保险。要保险就买保障，要投资就去投资，千万不要把两个结合在一起。",
   tool:{t:"两个选择比一比：同样一百万的保障",h:tTable(["做法","每年保费","多出来的"],[["买投资型保险（保险和投资混在一起）","大约 RM3,600","只多一点 cash value"],["只买定期人寿（term life），另外 RM1,800 自己投资","RM1,800","放 10%、二十五年，大约 RM177,000"]],1)+tNote("例子：三十岁女性，一百万、二十五年的 level term，每月大约一百五十。")},
   calc:[`你每年多付的 ${B(P.d)}，拿去自己投资（假设回报 10%），${P.yrs} 年后大约 ${KB(f10,1)}，本金只有 ${B(P.d*P.yrs)}；放在投资型保单里大约 3%，只有 ${B(f3,1)}。`],
   fork:c.hasI?`另外，全家的保费每个月不要超过净收入 10%，以你的收入是 ${B(c.I*.1)}。储蓄保险用 IRR 算，回报大约 2%，比 FD 还低，而且一锁就是五年、十年。`:"储蓄保险用 IRR 算，回报大约 2%，比 FD 还低；而且一锁就是五年、十年，agent 佣金 10% 到 25%，每年还有管理费。",
   re:"保险的功能是风险转移，投资是累积财富。把两者混在一起，只会让你付出更多的成本，却看不到效果。",
   so:"所以，要保险就买保障，要投资就去投资：买定期人寿，省下来的钱自己投资。",
   acts:[]}; }},
{id:"medcard",cat:"prot",needs:"I",cx:"I",q:"医药卡（medical card）要怎么选？",src:"观点卡《医药卡》（room and board RM200 以上、lifetime limit 最好 unlimited）；Kelvin 立场确认表第 24 题（全家保费最多净收入 10%）",
 kw:"医药卡 medical card 医疗保险 住院 room and board annual limit lifetime limit 保费 医药费 hospital",rel:["ins","savins","layoff"],
 ans:c=>{ const bud=c.I*.1;
  return {open:"最基本的 medical card 一定要有：住院费、手术费要有保险来 cover，不要动用到自己的储蓄。",
   tool:{t:"选医药卡，看这三个 limit",h:tTable(["看什么","Brader 的标准"],[["Room and board（每天的房间费）","RM200 以上"],["Annual limit（一年最多赔多少）","越高越好，应付一直涨的医药费"],["Lifetime limit（一生最多赔多少）","最好 unlimited"]],-1)},
   calc:[`全家的保费，每个月最多净收入 10%：以你的 ${B(c.I)}，就是 ${KB(bud)}。这笔钱要包括人寿、医药卡和严重疾病，不是一张医药卡就用完。`],
   fork:bud<450?"一张医药卡就要四五百块的话，已经差不多吃掉你全部的保险预算了。先选保费合理的，再留位置给人寿。":"千万不要一张医药卡，就买到贵贵的那种，要供四五百块的；剩下的预算，留给人寿和严重疾病。",
   re:"很多人被裁员以后，第一个反应是砍保险省钱，这是最危险的：失业的时候你更需要医药卡，因为你已经没有公司的 group insurance 了。",
   so:"所以，医药卡一定要有：room and board RM200 以上、lifetime limit 最好 unlimited；全家保费加起来不超过净收入 10%。",
   acts:[]}; }},
{id:"will",cat:"legacy",needs:"E",cx:"E",q:"我需要写遗嘱、做信托吗？",src:"观点卡《传承：信托、遗嘱与 nominee》（遗产被冻结、家人等三到五年；遗产先还债）",
 kw:"遗嘱 写遗嘱 信托 trust 传承 遗产 nominee 受益人 死后 过世 家人 冻结 授权书 wasiat",rel:["ins","couple","edu"],
 ans:c=>{ const debt=liveDebts().reduce((a,d)=>a+(d.bal||0),0);
  return {open:"如果你真的是爱你家人的话，那么这些你都要提前安排好，让他们少一点麻烦。",
   tool:{t:"传承的工具，趁清醒的时候做",h:tTable(["工具","用来做什么"],[["遗嘱","讲清楚财产给谁，家人不用等、不用吵"],["信托","孩子不会理财、还欠债，就每个月发生活费，不要一次过给"],["投资户口设 nominee","发生意外，孩子可以直接领"]],-1)},
   calc:[`没有安排好，遗产被冻结，家人可能要等三到五年。以你家每月开销 ${B(c.E)} 算，光是等三年，家人就要自己拿出 ${KB(c.E*36)}。`],
   fork:debt>0?`你现在还欠 ${B(debt)}。遗产要先还完贷款、卡债、income tax，才轮到家人；所以有债，就要买 debt cancellation 的人寿。`
     :"孩子不会理财、大手大脚的，不要一次过把钱交到他手上，用信托每个月发生活费，等他成熟了再放多一点。",
   re:"很多人以为传承是有钱人的事，快走的时候才做。我见过太多例子：遗产被冻结、家人等三到五年，甚至闹出家庭纠纷。",
   so:"所以，趁清醒的时候写好遗嘱；投资户口设好 nominee；孩子还不会理财的，用信托每个月发钱。",
   acts:[]}; }},
{id:"fdsafe",cat:"save",needs:"",cx:"",q:"钱放 FD、放银行最安全，为什么还要投资？",src:"观点卡《钱放银行越放越穷》（银行 0.2%：一万块十年两百块；10%：十年赚 16k）；Kelvin 立场确认表第 30 题（通胀统一 4%）",
 kw:"fd 定期存款 放银行 银行利息 保本 安全 储蓄户口 savings account 通胀 贬值 购买力 不想投资 储蓄 子弹",rel:["ef","fear","start"],
 params:[{k:"a",l:"放在银行的钱",u:"RM",d:()=>10000,min:1,main:1,cue:"放 存 有"},{k:"y",l:"放几年",u:"年",d:()=>10,min:1,max:50,step:1,cue:"放 年"}],
 ans:(c,P)=>{ const a=P.a, y=P.y, s=a*(Math.pow(1.002,y)-1), pp=a/Math.pow(1+INFL,y), g=a*(Math.pow(1.1,y)-1);
  return {open:"存太多钱在银行，不是理财，而是财务陷阱。不过先分清楚：这笔钱是什么时候要用的？",
   tool:{t:"储蓄和投资，分开来用",h:tTable(["钱什么时候要用","放哪里","为什么"],[["一两年内（旅行、首期、救命的钱）","FD、MMF","要保本，放 3% 就好"],["三年、十年以后（孩子读大学、退休）","投资","要跑赢通胀"]],-1)+tNote("银行的储蓄户口最多给你 0.2%，FD 大约 3%，通胀 4%：放 FD，每年还是贬值大约 1%。")},
   calc:[`${B(a)} 放储蓄户口 ${y} 年，只多 ${B(s)} 利息；通胀 4%，${y} 年后只剩今天 ${B(pp)} 的购买力。拿去投资（假设回报 10%），大约赚 ${KB(g,1)}。`],
   fork:efFull()?"你的救命的钱已经存好了。多出来、几年都不会用到的钱，一直放银行，就是在慢慢变穷。":"你的救命的钱还没存满。这一部分放 FD、MMF 是对的；存满以后，多出来的钱才拿去投资。",
   re:"保本的，不叫做投资，而是储蓄。觉得投资不是包赚、继续把钱放在银行，这个才是百分之百包亏的。储蓄是子弹，投资是枪。",
   so:"所以，一两年内要用的钱放 FD、MMF；三年以后才用的钱拿去投资，不要一直放在银行。",
   acts:[]}; }},
{id:"utfee",cat:"inv",needs:"",cx:"",q:"Unit trust 收 5% 手续费，值得买吗？",src:"观点卡《基金费用与 benchmark》（100k、二十年：S&P 500 变 672k，基金扣 3% + 1.8% 剩 469.8k）；Kelvin 立场确认表第 25 题",
 kw:"unit trust 基金 ut sales charge 手续费 管理费 management fee 佣金 benchmark fund manager etf 大盘 s&p 500 新手买什么 投资什么 跑不赢 agent",rel:["fear","timing","start"],
 params:[{k:"pv",l:"投资多少",u:"RM",d:()=>100000,min:1,main:1,cue:"投资 放 买"},{k:"y",l:"放几年",u:"年",d:()=>20,min:1,max:50,step:1,cue:"放 年"},{k:"sc",l:"Sales charge",u:"%",d:()=>3,max:10,step:.5,cue:"sales charge 手续费 佣金"},{k:"mf",l:"每年管理费",u:"%",d:()=>1.8,max:5,step:.1,cue:"管理费 management"}],
 ans:(c,P)=>{ const e=P.pv*Math.pow(1.1,P.y), f=P.pv*(1-P.sc/100)*Math.pow(1.1-P.mf/100,P.y), loss=Math.max(0,e-f);
  return {open:"你付钱请人来帮你投资，结果表现比直接买 ETF 还要差，你就亏咯。",
   tool:{t:"Unit trust 的两种收费",h:tTable(["收费","多少"],[["Sales charge（agent 佣金）","3% 到 5%；网上平台买大约 1.5%"],["Annual management fee","每年 1.5% 到 1.8%，亏钱也要付"]],-1)+tNote("90% 的基金经理，长期都跑不赢大盘。")},
   calc:[`${B(P.pv)} 放 ${P.y} 年：自己买 S&P 500（假设回报 10%），大约变 ${B(e,1)}；基金扣了 ${P.sc}% sales charge 和每年 ${P.mf}% 管理费，只剩 ${B(f,1)}，少了 ${KB(loss,1)}（${pc(e>0?loss/e:0)}）。`],
   fork:"已经买了的，Google 你那只基金的 fund fact sheet，看它有没有跑赢 benchmark。连续三年都输，就卖掉，直接买 ETF。",
   re:"千万不能因为觉得 1% 到 2% 的数字很小，就不去理会它。复利是爆发式的，费用也是反方向的复利。",
   so:"所以，普通人买 ETF 大盘就好；手上的基金跑不赢 benchmark，就换掉。",
   acts:[]}; }},

// 金额取到分（0.01）；max 默认 RM10 亿，太大的数字多半是打错
const MAXRM=1e9;
function readNum(inputSel,{required,min,gt,label,max=MAXRM}={}){
  const el=$(inputSel), raw=el.value.trim();
  if(el.validity&&el.validity.badInput) return {err:"请输入有效的数字"};
  if(raw===""){ return required?{err:`请输入${label||"金额"}`}:{v:null}; }
  let v=Number(raw); if(!isFinite(v)) return {err:"请输入有效的数字"};
  if(v>max) return {err:`${label||"金额"}太大了，最多 ${rmRaw(max)}`};
  v=Math.round(v*100)/100;
  if(gt===0&&!(v>0)&&Number(raw)>0) return {err:`${label||"金额"}最少 RM0.01`};
  if(gt!=null&&!(v>gt)) return {err:`${label||"金额"}要大于 ${gt}`};
  if(min!=null&&v<min) return {err:min===0?"不能是负数":`不能少过 ${min}`};
  return {v};
}

function rankImpact(tmp,pos){ const F0=flowNow(), F1=flowSim({add:tmp,at:pos}), x=F1.items.find(y=>y.id===tmp.id);
  if(!F1.hasI) return '<span class="dim">填了收入和开销，就能看到排这里会不会让别的目标变晚。</span>';
  if(!x) return "";
  const L=lateOf(x), me=x.want0-x.a0>=.5?`<span class="wn">这个目标每月只分到 ${rm(x.a0)}（要 ${rm(x.want0)}），${L===Infinity?"存不够":L>=1?`会晚 ${durTxt(L)}`:"后面会补上"}</span>`
    :L>=1?`<span class="wn">现在分得到，但后面会分不够，会晚 ${durTxt(L)}</span>`:`<span class="gd">✓ 每月 ${rm(x.want0)} 分得到，准时</span>`;
  const hurt=[]; F1.items.forEach(b=>{ if(b.id===tmp.id) return; const a=F0.items.find(y=>y.id===b.id); if(!a) return;
    if(b.k==="g"){ const da=lateOf(a), db=lateOf(b); if(db===Infinity&&da!==Infinity) hurt.push(`${itemName(b.id)}会因此存不够`); else if(isFinite(db)&&db>=1&&db-Math.max(0,da)>=1) hurt.push(`${itemName(b.id)}会因此晚 ${durTxt(db-Math.max(0,da))}`); }
    else if(isFinite(a.fin)&&b.fin-a.fin>=1) hurt.push(isFinite(b.fin)?`高利息债会晚 ${durTxt(b.fin-a.fin)}还清`:"高利息债会还不清"); });
  return me+(hurt.length?`<ul>${hurt.slice(0,4).map(h=>`<li class="wn">${h}</li>`).join("")}${hurt.length>4?`<li class="wn">还有 ${hurt.length-4} 个会变晚</li>`:""}</ul>`:"");
}
// 难不难：用钱说，不用百分比（小白看得懂）。others = 其他目标每月已经要用掉多少
function easeHTML(m,free,others){
  if(m<=0) return `<span class="ok">✓ 轻松：已经存够了</span>`;
  if(!S.income) return `<span class="dim">在「我的资料」填收入和开销，就能算难度</span>`;
  if(free<=0) return others>0?`<span class="wn">△ 每月剩下的钱，已经被其他目标用完了</span>，多给它一点时间会轻松很多`:`<span class="wn">△ 现在每个月没有剩钱</span>，先看看哪一项大开销可以减少`;
  const lead=others>0?`扣掉其他目标，每月还剩 ${rm(free)}`:`每月剩 ${rm(free)}`, r=m/free;
  return r<=.25?`<span class="ok">✓ 轻松</span> · ${lead}，它只要 ${rm(m)}`:r<=.6?`<span class="ok">✓ 做得到</span> · ${lead}，它要 ${rm(m)}`:r<=1?`<span class="wn">△ 有点紧</span> · ${lead}，它要 ${rm(m)}，只剩 ${rm(free-m)}`:`<span class="bd">✕ 不够</span> · ${lead}，它要 ${rm(m)}，差 ${rm(m-free)}。期限放长一点会轻松很多`;
}

      <div class="field" id="fName"><label for="aName">目标名称</label><div class="inp"><input id="aName" type="text" maxlength="40" placeholder="例如：首尔旅行金" autocomplete="off"></div><div class="ferr"></div></div>
      <div class="two"><div class="field" id="fTarget"><label for="aTarget">目标金额</label><div class="inp"><span>RM</span><input id="aTarget" type="number" inputmode="decimal" min="1" step="any" placeholder="10000"></div><div class="ferr"></div></div>
        <div class="field" id="fDue"><label for="aDue">截止日期</label><div class="inp"><select id="aDue">${ymOptions(addMonthsYM(12))}</select></div><div class="ferr"></div></div></div>
      <div class="field" id="fSaved"><label for="aSaved">初始已存金额 <span class="opt-t">（可选）</span></label><div class="inp"><span>RM</span><input id="aSaved" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div><div class="ferr"></div></div>
      </div>`,
    foot:`<button class="btn ghost" type="button" id="aCancel">取消</button><button class="btn pri" type="submit" id="aSubmit">建立目标</button>`,
    focus:prefill?"#aSubmit":"#aText",
    onMount:()=>{
      let G=null, gT=0, POS=null; // POS = 排第几（从 0 算），默认最后；救命的钱默认排第 1（Brader 的顺序），用户自己选过就照他的
      const TOUCH=new Set(); // 用户自己改过的栏位，重新估算时不盖掉
      const moreLabel=()=>{ const b=$("#aFold"), open=!$("#aFields").hidden; b.setAttribute("aria-expanded",String(open));
        b.textContent=open?"收起":G?(G.rough?"填你的预算":"修改金额和日期"):"自己填名称、金额和日期"; };
      const setMore=open=>{ $("#aFields").hidden=!open; moreLabel(); };
      const typeNow=()=>G?G.type:detectType($("#aName").value);
      const calc=()=>{
        const t=parseFloat($("#aTarget").value)||0, sv=Math.max(0,parseFloat($("#aSaved").value)||0), due=$("#aDue").value, box=$("#aCalc");
        if(t<=0){ box.innerHTML=""; return; }
        const n=Math.max(1,monthsBetween(today(),deadlineDate(due))), k=recommend(calMonths(today(),due),typeNow()), O=OPTS[k], m=t>sv?pmtFor(t,sv,mrate(O.r),n):0;
        const [yy,mm]=due.split("-"), due2=(+yy+1)+"-"+mm, n2=Math.max(1,monthsBetween(today(),deadlineDate(due2))), m2=t>sv?pmtFor(t,sv,mrate(OPTS[recommend(calMonths(today(),due2),typeNow())].r),n2):0;
        const vis=visOrder(), N=vis.length; if(!TOUCH.has("pos")) POS=typeNow()==="emergency"?0:N; if(POS==null||POS>N) POS=N;
        // 排第 1 的先拿钱：难度只扣掉排在它前面的目标
        const sur=S.income?S.income-S.expense:0, used=activeSorted().filter(x=>{ const i=vis.indexOf(x.id); return i>=0&&i<POS; }).reduce((a,x)=>a+planM(x,stat(x)),0), free=sur-used;
        const ease=easeHTML(m,free,used);
        const canExt=[...$("#aDue").options].some(o=>o.value===due2), easy=m>0&&m2>0&&m2<m-.5&&canExt;
        // 排第几：放在哪个前面，马上看会不会让别的目标变晚
        const tmp=N&&m>0?norm({id:"__new",type:typeNow(),name:$("#aName").value.trim()||"这个目标",target:t,saved:sv,startAmt:sv,start:today(),deadline:due,log:[],status:"active"}):null;
        const rk=tmp?`<dt>排第几</dt><dd id="tRank"><div class="rkpick"><div class="inp"><select id="aPos" aria-label="排第几">${Array.from({length:N+1},(_,i)=>`<option value="${i}"${i===POS?" selected":""}>第 ${i+1}${i===N?"（最后）":`（${esc(itemName(vis[i]))}前面）`}</option>`).join("")}</select></div></div><div class="rkout" id="tRankOut">${typeNow()==="emergency"&&POS===0?'<span class="dim">Brader 的顺序：救命的钱排第一，你也可以改。</span><br>':""}${rankImpact(tmp,POS)}</div></dd>`:"";
        box.innerHTML=`<div class="ares" id="aHero"><span class="an">${esc($("#aName").value.trim()||"这个目标")} · ${rm(t)} · ${ymLabel(due)}</span>${m<=0?`<b class="ad">已经存够了</b>`:`<b class="ad">每天存 ${dayRM(m)}</b><span class="am" id="tCalc">每月 ${rm(m)}${treat(m)?` · ${treat(m)}`:""}</span>`}</div>
          <div class="est"><dl><dt>放哪里</dt><dd id="tOpt"><b>${O.name}</b> <span class="dim">${O.range} · ${O.risk}</span></dd>
          <dt>难度</dt><dd id="tEase">${ease}</dd>${rk}
          ${easy?`<dt>轻松模式</dt><dd id="tEasy">多给它一年（${ymLabel(due2)}），每月只要 <b>${rm(m2)}</b> · <button class="linkbtn" type="button" id="tExt">用这个日期</button></dd>`:""}</dl></div>`;
        const ex=$("#tExt"); if(ex) ex.onclick=()=>{ TOUCH.add("due"); $("#aDue").value=due2; calc(); };
        const ap=$("#aPos"); if(ap) ap.onchange=()=>{ TOUCH.add("pos"); POS=+ap.value; calc(); const b=$("#aPos"); if(b) b.focus(); };
      };
      const setDue=n=>{ const v=addMonthsYM(n); $("#aDue").value=v; if($("#aDue").value!==v){ $("#aDue").insertAdjacentHTML("afterbegin",`<option value="${v}">${ymLabel(v)}</option>`); $("#aDue").value=v; } };
      // mode: 不写 = 打字时自动估；"go" = 马上估；"reset" = 点例子，全部重新估
      const runGuess=mode=>{ clearTimeout(gT); if(!$("#aText")) return; const txt=$("#aText").value.trim();
        $("#aChips").hidden=!!txt;
        if(!txt){ G=null; $("#aEst").innerHTML=""; if(!TOUCH.has("name")) $("#aName").value=""; if(!TOUCH.has("target")) $("#aTarget").value=""; moreLabel(); calc(); return; }
        if(!mode&&txt.length<2) return;
        if(mode==="reset") TOUCH.clear();
        if(DEBT_TXT.test(txt)){ G=null; if(!TOUCH.has("name")) $("#aName").value=""; if(!TOUCH.has("target")) $("#aTarget").value=""; calc(); $("#aCalc").innerHTML="";
          $("#aEst").innerHTML=`<div class="ares" id="aDebt"><span class="an">这是还债，不是存钱</span><b class="ad" style="font-size:var(--fs-title)">去还债计划排好顺序</b><span class="am">算出先还哪一笔、几时还清。</span><button class="btn pri sm" type="button" id="aToDebt" style="margin-top:10px">去还债计划</button></div>`;
          $("#aToDebt").onclick=()=>{ const pre={kind:debtKindOf(txt),bal:parseAmount(txt)||""}; go("debt"); openDebtForm(null,pre); }; moreLabel(); return; }
        G=guess(txt); G.src=txt;
        if(!TOUCH.has("name")) $("#aName").value=G.name;
        if(!TOUCH.has("target")) $("#aTarget").value=G.target;
        if(!TOUCH.has("due")) setDue(G.months);
        if(G.rough){ if(!TOUCH.has("target")) $("#aTarget").value=""; setMore(true); }
        $("#aEst").innerHTML=`<div class="est"><dl><dt>识别目标</dt><dd><b>${icon(G.type)} ${TYPE_LABEL[G.type]}</b></dd><dt>怎么估</dt><dd class="guess">${esc(G.how)}</dd></dl>${ASK_TXT.test(txt)?`<p class="sub">这比较像一个问题。<button class="linkbtn" type="button" id="aToAsk">去问 Brader</button></p>`:""}</div>`;
        if($("#aToAsk")) $("#aToAsk").onclick=()=>{ closeSheet(); go("ask"); };
        ["#fText","#fName","#fTarget","#fSaved"].forEach(id=>fieldErr(id,"")); moreLabel(); calc(); };
      $("#aFold").onclick=()=>setMore($("#aFields").hidden);
      $("#aText").addEventListener("input",e=>{ fieldErr("#fText",""); if(e.isComposing) return; clearTimeout(gT); gT=setTimeout(()=>runGuess(),260); });
      $("#aText").addEventListener("compositionend",()=>{ clearTimeout(gT); gT=setTimeout(()=>runGuess(),120); });
      $("#aText").addEventListener("keydown",e=>{ if(e.key!=="Enter"||e.isComposing) return; e.preventDefault(); runGuess("go"); if(window.matchMedia&&matchMedia("(pointer:coarse)").matches) e.target.blur(); });
      $("#sheetRoot").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ $("#aText").value=c.textContent; runGuess("reset"); });
      [["#aTarget","target"],["#aSaved","saved"],["#aName","name"]].forEach(([id,k])=>$(id).addEventListener("input",()=>{ TOUCH.add(k); fieldErr("#f"+id.slice(2),""); calc(); }));
      $("#aDue").addEventListener("change",()=>{ TOUCH.add("due"); calc(); });
      $("#aCancel").onclick=closeSheet;
      moreLabel();
      $("#addForm").onsubmit=e=>{ e.preventDefault();
        const typed=$("#aText").value.trim(); if(typed&&(!G||G.src!==typed)) runGuess("go");
        if($("#aToDebt")){ $("#aToDebt").click(); return; }
        const name=$("#aName").value.trim(), t=readNum("#aTarget",{required:true,gt:0,label:"目标金额"}), sv=readNum("#aSaved",{min:0});
        fieldErr("#fName",name?"":"请输入目标名称"); fieldErr("#fTarget",t.err||""); fieldErr("#fSaved",sv.err||"");
        const bad=!name?"#aName":t.err?"#aTarget":sv.err?"#aSaved":null;
        if(bad){
          if($("#aFields").hidden&&!typed){ ["#fName","#fTarget","#fSaved"].forEach(id=>fieldErr(id,"")); fieldErr("#fText","先写一句你想完成的事"); $("#aText").focus(); return; }
          setMore(true); $(bad).focus(); return; }
        const saved=sv.v||0, type=typeNow();
        const ex=Object.assign({},G?G.extra:{}); if(TOUCH.has("target")||(G&&t.v!==G.target)) delete ex.efEst;
        createGoal({type,text:G?G.src:"",name,target:t.v,deadline:$("#aDue").value,saved,extra:ex,pos:POS}); };
      if(prefill) runGuess("reset");
      if(over&&G){ if(over.name) $("#aName").value=over.name; if(over.target>0){ G.target=Math.round(over.target/10)*10; $("#aTarget").value=G.target; }
        if(over.months>0) setDue(Math.max(1,Math.round(over.months))); if(over.saved>0) $("#aSaved").value=Math.round(over.saved);
        if(over.how){ G.how=over.how; const gs=$("#aEst .guess"); if(gs) gs.textContent=over.how; } calc(); }
    }});
}

/* ---- update progress ---- */
// 记了这一笔以后是多少：跟真的存的时候同一个算法（recomputeSaved），预览和结果一定一样
function savedAfter(g,entry){ const t={startAmt:g.startAmt,start:g.start,saved:0,log:g.log.concat([entry])}; recomputeSaved(t); return t.saved; }
// 这一笔最早可以记哪一天：不能早过目标开始的日期；存入/取出不能早过最后一笔「更新总额」（会被它盖掉）；更新总额不能早过最后一笔记录
function dateRule(g,mode,d){ const L=g.log.filter(l=>!l.base), lastSet=L.filter(l=>l.k==="set").reduce((a,l)=>l.d>a?l.d:a,""), last=L.reduce((a,l)=>l.d>a?l.d:a,"");
  if(d<g.start) return `日期不能早过这个目标开始的日期（${ymdLabel(g.start)}）`;
  if(mode==="set"&&last&&d<last) return `「更新总额」是现在一共有多少，日期不能早过最后一笔记录（${ymdLabel(last)}）`;
  if(mode!=="set"&&lastSet&&d<lastSet) return `${ymdLabel(lastSet)} 已经记了「更新总额」，这天以前的存入、取出不会算进去。请选这天或之后的日期`;
  return ""; }
function openUpdate(g){
  const pct=v=>Math.min(100,Math.max(0,v/Math.max(1,g.target)*100));
  modal({title:"记一笔：存入、取出或改总额",sub:esc(g.name),form:"uForm",
    body:`<p class="cur">目前已存 <b>${rm(g.saved)}</b> / ${rm(g.target)} · ${pctOf(g,g.saved)}%</p>
      <div class="seg" role="group" aria-label="更新方式"><button type="button" data-m="add" aria-pressed="true">存入</button><button type="button" data-m="out" aria-pressed="false">取出</button><button type="button" data-m="set" aria-pressed="false">更新总额</button></div>
      <div class="field" id="fAmt"><label for="uAmt" id="uLbl">本次存入金额</label><div class="inp"><span>RM</span><input id="uAmt" type="number" inputmode="decimal" min="0" step="any" placeholder="例如 300"></div><div class="ferr"></div></div>
      <p class="sub" id="uOutTip" hidden style="margin:-6px 0 12px">${g.type==="emergency"?"用了救命的钱？用得对。取出以后，网站会帮你算好每个月慢慢补回来，不用一个月补完。":"钱是拿去付这个目标的吗（例如先买了机票）？那就不用按取出，进度照算。户口里的钱会比网站上少，这是正常的。"}</p>
      <div class="uprev" id="uPrev" aria-live="polite"></div>
      <div class="two"><div class="field" id="fDate"><label for="uDate">更新日期</label><div class="inp"><input id="uDate" type="date" value="${today()}" max="${today()}"></div><div class="ferr"></div></div>
        <div class="field"><label for="uNote">备注 <span class="opt-t">（可选）</span></label><div class="inp"><input id="uNote" type="text" maxlength="60" placeholder="例如：花红"></div></div></div>`,
    foot:`${isPh()?`<div class="pz-hb" id="uHb">${holdHTML("uHold","按住","存入")}<p class="pz-tip" id="uTip" aria-live="polite"></p></div>`:""}<button class="btn ghost" type="button" id="uCancel"${isPh()?" hidden":""}>取消</button><button class="btn pri" type="submit" id="uOk"${isPh()?" hidden":""}>确认更新</button>`,
    focus:"#uAmt",
    onMount:()=>{
      let mode="add", busyOk=false, bigOk=""; const ph=isPh();
      const footFor=()=>{ if(!ph) return; const add=mode==="add"; $("#uHb").hidden=!add; $("#uCancel").hidden=add; $("#uOk").hidden=add; }; // 手机：存入用按住充能，取出和更新总额用普通按钮
      const LBL={add:"本次存入金额",out:"本次取出金额",set:"户口现在一共有多少（包括投资赚的）"};
      const wps=wpsOf(g);
      const prev=()=>{ const v=parseFloat($("#uAmt").value), p0=pct(g.saved);
        if(!(v>=0)){ const w=nextWp(g); $("#uPrev").innerHTML=`现在 <b>${pctOf(g,g.saved)}%</b>${w?` · 离下一站 ${esc(wpName(w))} 还差 <b>${rm(w.gap)}</b>`:""}<span class="bar"><i style="width:${p0}%"></i></span>`; return; }
        const dv=$("#uDate").value||today(), ns=savedAfter(g,{id:"__p",d:dv,a:mode==="out"?-v:v,k:mode==="set"?"set":"add"}), p1=pct(ns), up=p1>=p0, f=wps.find(x=>ns/Math.max(1,g.target)<x.f-1e-9);
        $("#uPrev").innerHTML=`进度 <b>${pctOf(g,g.saved)}%</b> → <b class="${up?"gd":"wn"}">${pctOf(g,ns)}%</b> · 更新后 <b>${rm(ns)}</b>${ns>=g.target?` · <span class="gd">🎉 存够了！</span>`:f?` · 离 ${esc(wpName(f))} 还差 <b>${rm(g.target*f.f-ns)}</b>`:""}
          <span class="bar"><i style="width:${Math.min(p0,p1)}%"></i>${up?`<s style="left:${p0}%;width:${p1-p0}%"></s>`:""}</span>`; };
      $("#sheetRoot").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ mode=b.dataset.m; $("#sheetRoot").querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); $("#uLbl").textContent=LBL[mode]; $("#uOutTip").hidden=mode!=="out"; fieldErr("#fAmt",""); footFor(); prev(); });
      $("#uAmt").addEventListener("input",()=>{ fieldErr("#fAmt",""); prev(); }); prev();
      $("#uDate").addEventListener("input",()=>{ fieldErr("#fDate",""); prev(); });
      $("#uCancel").onclick=closeSheet;
      const check=()=>{ const r=readNum("#uAmt",mode==="set"?{required:true,min:0}:{required:true,gt:0});
        let err=r.err||""; if(!err&&mode==="out"&&r.v>g.saved+1e-9) err=`取出的钱不能超过目前已存的 ${rm(g.saved)}`;
        const d=$("#uDate").value, dErr=!d||!YMDRE.test(d)?"请选择日期":d>today()?"日期不能在未来":dateRule(g,mode,d);
        fieldErr("#fAmt",err); fieldErr("#fDate",dErr);
        if(err){ $("#uAmt").focus(); return null; } if(dErr){ $("#uDate").focus(); return null; }
        if(mode!=="out"&&bigAmt(g,r.v,mode)&&bigOk!==mode+r.v){ bigOk=mode+r.v; fieldErr("#fAmt",bigMsg(g,r.v,mode,ph&&mode==="add"?"再按住一次":"再按一次")); $("#uAmt").focus(); return null; }
        return {v:r.v,d}; };
      $("#uForm").onsubmit=e=>{ e.preventDefault(); if(ph&&mode==="add"){ const a=document.activeElement; if(a&&a.blur) a.blur(); return; } commit(); };
      if(ph){ footFor(); bindHold($("#uHold"),{tip:"#uTip",verb:"存入",ready:()=>!!check(),done:()=>commit()}); }
      function commit(){ const c=check(); if(!c) return; const {v,d}=c;
        const wpN=x=>wps.filter(w=>x>=g.target*w.f-.5).length, wb=wpN(g.saved);
        if(busyOk) return; busyOk=true;
        const snap=snapState(), view={page:VIEW.page,id:VIEW.id}, s0=g.saved;
        g.log.push({id:uid(),d,a:mode==="out"?-v:v,k:mode==="set"?"set":"add",n:$("#uNote").value.trim()}); recomputeSaved(g); save(); if(mode==="add") askSafe();
        if(ph&&mode==="add"&&pzMotion()&&g.saved>s0){ const done=g.saved>=g.target&&g.status==="active", hit=!done&&wpN(g.saved)>wb?wps[wpN(g.saved)-1]:null, from=$("#uHold").getBoundingClientRect(); closeSheet();
          pzDepositStage(g,v,s0,done,hit,from,()=>{ if(done){ completeGoal(g,snap,view,true); return; } render(); offerUndo(`已存入 ${rm(v)}，现在 ${pctOf(g,g.saved)}%`+(hit?`，${hit.hit} 🎉`:""),snap,view,nextUp(g)); }); return; }
        const finish=()=>{ closeSheet();
        if(g.saved>=g.target&&g.status==="active"){ completeGoal(g,snap,view); }
        else { const hit=wpN(g.saved)>wb?wps[wpN(g.saved)-1]:null;
          render(); if(g.saved>s0) sfx(hit?"milestone":"coin");
          offerUndo((mode==="out"?`已取出 ${rm(v)}`:mode==="set"?`已更新，现在一共 ${rm(g.saved)}`:`已存入 ${rm(v)}，现在 ${pctOf(g,g.saved)}%`)+(hit?`，${hit.hit} 🎉`:""),snap,view,mode==="add"?nextUp(g):null);
          if(hit) setTimeout(()=>{ const rg=$("#main .hero .ring"), b=rg?rg.getBoundingClientRect():null; milestoneBurst(b?b.left+b.width/2:innerWidth/2,b?b.top+b.height/2:innerHeight/3); },260); } };
        if(fxOn()){ const ob=$("#uOk"); ob.classList.add("doneok"); ob.textContent="✓ 已更新"; ob.disabled=true; setTimeout(finish,420); } else finish(); }
    }});
}

/* ---- edit goal ---- */
function openEdit(g){
  const term=termOf(g), rec=recommend(term,g.type);
  modal({title:"编辑目标",sub:"改金额或日期，每月要存的钱会从今天重新算。",form:"eForm",
    body:`<div class="field" id="fEName"><label for="eName">目标名称</label><div class="inp"><input id="eName" type="text" maxlength="40" value="${esc(g.name)}"></div><div class="ferr"></div></div>
      <div class="two"><div class="field" id="fETarget"><label for="eTarget">目标金额</label><div class="inp"><span>RM</span><input id="eTarget" type="number" inputmode="decimal" min="1" step="any" value="${g.target}"></div><div class="ferr"></div>${g.type==="emergency"&&S.expense>0?`<button class="linkbtn" type="button" id="eRe">按最新开销重算（${rm(S.expense)} × ${efMonths(S)} 个月）</button>`:""}</div>
        <div class="field"><label for="eDue">截止日期</label><div class="inp"><select id="eDue">${ymOptions(g.deadline)}</select></div></div></div>
      <div class="field"><label for="eOpt">储蓄方式（钱放哪里）</label><div class="inp"><select id="eOpt"><option value=""${g.option?"":" selected"}>照 Brader 推荐（现在是 ${OPTS[rec].name}）</option>${OPT_ORDER.map(k=>{ const su=suit(k,term,g.type); return `<option value="${k}"${g.option===k?" selected":""}>${OPTS[k].name} · ${OPTS[k].range}${su==="no"?(g.type==="emergency"?"（不适合）":"（期限太短）"):su==="low"?"（跑不赢通胀）":""}</option>`; }).join("")}</select></div></div>
      <div class="field" id="fEBudget"><label for="eBudget">我每个月可以放 <span class="opt-t">（可选，不填就照每月需要存）</span></label><div class="inp"><span>RM</span><input id="eBudget" type="number" inputmode="decimal" min="0" step="any" value="${g.budget||""}" placeholder="${HIDE?"****":Math.round(stat(g).monthly)}"></div><div class="ferr"></div></div>`,
    foot:`<button class="btn ghost" type="button" id="eCancel">取消</button><button class="btn pri" type="submit" id="eOk">保存修改</button>`,
    onMount:()=>{
      const re=$("#eRe"); if(re) re.onclick=()=>{ $("#eTarget").value=S.expense*efMonths(S); fieldErr("#fETarget",""); };
      ["#eName","#eTarget","#eBudget"].forEach(id=>$(id).addEventListener("input",()=>fieldErr("#fE"+id.slice(2),"")));
      $("#eCancel").onclick=closeSheet;
      $("#eForm").onsubmit=e=>{ e.preventDefault();
        const name=$("#eName").value.trim(), t=readNum("#eTarget",{required:true,gt:0,label:"目标金额"}), b=readNum("#eBudget",{min:0});
        fieldErr("#fEName",name?"":"请输入目标名称"); fieldErr("#fETarget",t.err||""); fieldErr("#fEBudget",b.err||"");
        const bad=!name?"#eName":t.err?"#eTarget":b.err?"#eBudget":null; if(bad){ $(bad).focus(); return; }
        const nt=t.v, nd=$("#eDue").value;
        // amount or date changed: restart the plan from today, so earlier savings are not judged against the new target
        if((nt!==g.target||nd!==g.deadline)&&g.status!=="done"){ g.log.forEach(l=>{ l.base=true; }); g.start=today(); g.startAmt=g.saved; }
        g.name=name; g.target=nt; g.deadline=nd;
        const o=$("#eOpt").value; if(o) g.option=o; else delete g.option;

function downloadBackup(){
  const prevBk=S.lastBackup; S.lastBackup=today(); save(); const json=JSON.stringify({S,goals:GOALS},null,1), fn="财务目标备份-"+today()+".json";
  const undo=msg=>{ S.lastBackup=prevBk; save(); if(msg) toast(msg,"err"); };
  const done=msg=>{ obSet("bk",dataSig()); ERR_HOLD=0; toast(msg); closeSheet(); render(); };
  const saveFile=()=>{ const blob=new Blob([json],{type:"application/json"}), a=document.createElement("a"), url=URL.createObjectURL(blob); a.href=url; a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),30000); done("备份已下载"); };
  if(window.claude&&typeof window.claude.use==="function"){
    // inside the claude.ai link the page cannot start a download itself; the downloads capability asks the viewer instead
    (async()=>{ let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
      if(!dl) return undo("这里下载不了备份");
      try{ await dl.save({filename:fn,data:json}); done("备份已下载"); }catch(e){ undo(e&&e.code==="declined"?"没有下载":"现在下载不了，等一下再试"); } })();
    return; }
  // iPhone：用系统的分享菜单「存储到文件」，主屏幕 App 里也能用
  if(IOS&&navigator.share&&navigator.canShare&&typeof File==="function"){ let f=null; try{ f=new File([json],fn,{type:"application/json"}); }catch(e){}
    if(f&&navigator.canShare({files:[f]})){ navigator.share({files:[f]}).then(()=>done("备份已保存")).catch(e=>{ if(e&&e.name==="AbortError") undo(); else saveFile(); }); return; } }
  saveFile();
}
function applyBackup(d,quiet){ const c=cleanData(d); if(c.why) throw new Error(c.why); d=c.d; const gs=d.goals.map(norm); ["debts","debtBase","debtUpd","debtWins","spend","order","debtX","mplan","checks"].forEach(k=>{ delete S[k]; }); /* 发薪日留着（备份里有就用备份的） */ S=Object.assign(S,d.S||{}); GOALS=gs; save(); obSet("bk",dataSig()); closeSheet(); if(!quiet) toast("已还原 "+GOALS.length+" 个目标"); go("overview"); }
/* 还原之前先给用户看清楚：备份里有什么、现在这里有什么，按「取代」才换；换了以后还可以按「撤销」换回来。
   这里还没有资料（第一次打开），就直接还原，没有东西会不见。 */
const dataSum=(goals,debts)=>{ const gs=Array.isArray(goals)?goals.filter(Boolean):[], ds=Array.isArray(debts)?debts.filter(Boolean):[];
  return {n:gs.length,saved:gs.reduce((a,g)=>a+Math.max(0,+g.saved||0),0),debts:ds.length}; };

  const inB=new Set(d.goals.flatMap(g=>g.log.map(l=>l.id))), newer=GOALS.reduce((a,g)=>a+(g.log||[]).filter(l=>!l.base&&!inB.has(l.id)).length,0);

  modal({title:"用这份备份取代现在的资料？",
    body:`<div class="rcmp">${col("这份备份",when?ymdLabel(when)+" 备份":"不知道哪天备份的",B)}<span class="ra" aria-hidden="true">${svgI("next")}</span>${col("现在这里","今天",N)}</div>
      ${newer?`<p class="rwarn">现在这里有 <b>${newer} 笔存款记录</b>是这份备份里没有的，取代以后会不见。</p>`:""}
      <p class="sub" style="margin:12px 0 0">取代以后，现在的目标、存款记录和还债资料，都会换成备份里的。按错了，马上按「撤销」就能换回来。</p>`,
    foot:`<button class="btn ghost" type="button" id="rNo">取消</button><button class="btn danger" type="button" id="rYes">取代现在的资料</button>`,focus:"#rNo",
    onMount:()=>{ $("#rNo").onclick=closeSheet;
      $("#rYes").onclick=()=>{ const snap=snapState(), view={page:VIEW.page,id:VIEW.id}; applyBackup(d,true); offerUndo("已还原 "+GOALS.length+" 个目标",snap,view); }; }});
  return true;

/* ================= Confetti (Magic UI): milestone bursts, fireworks when a goal is completed ================= */
const CF={P:[],raf:0};
function burstAt(x,y,n,power){
  const c=$("#confetti"); if(c.hidden){ c.hidden=false; c.width=innerWidth; c.height=innerHeight; }
  const cols=["#FF6B5B","#2EC4A6","#FFC43D","#5B7CFA","#FF8FB1","#14233C","#FFFFFF"]; // 彩带：C 风的颜色
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=(Math.random()*.7+.3)*power;
    CF.P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-power*.35,s:Math.random()*5+3,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,k:Math.random()<.35,life:0}); }
  if(!CF.raf) CF.raf=requestAnimationFrame(cfTick);
}
function cfTick(){
  const c=$("#confetti"), ctx=c.getContext("2d"); ctx.clearRect(0,0,c.width,c.height);
  CF.P=CF.P.filter(p=>p.life<130);
  CF.P.forEach(p=>{ p.life++; p.vy+=.26; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=.12; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=Math.max(0,1-p.life/130); ctx.fillStyle=p.c;
    if(p.k){ ctx.beginPath(); for(let j=0;j<5;j++){ const a=j*Math.PI*.8; ctx.lineTo(Math.cos(a)*p.s*.75,Math.sin(a)*p.s*.75); } ctx.closePath(); ctx.fill(); } else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
  if(CF.P.length) CF.raf=requestAnimationFrame(cfTick); else { CF.raf=0; ctx.clearRect(0,0,c.width,c.height); c.hidden=true; }
}
function milestoneBurst(x,y){ if(fxOn()) burstAt(x,y,70,9); }

async function initCloud(){

}

function ckSet(ym,id,st){ if(!plainObj(S.checks)) S.checks={}; const C=plainObj(S.checks[ym])?S.checks[ym]:(S.checks[ym]={}); C.d=today(); if(!plainObj(C.r)) C.r={}; if(id) C.r[id]=st;

// ＋存钱先选哪一个：救命的钱这个月还没存好就选它；不然照你排的先后，选第一个这个月还没存好的

  const on=()=>document.documentElement.classList.contains("phone");
  // 手指底下还能往这个方向滑的内容（里面的列表滑到尽头，就轮到外面的页面）
  const mov=(n,dir)=>{ for(let e=n;e&&e!==document.body;e=e.parentElement){ if(!/auto|scroll/.test(getComputedStyle(e).overflowY)||e.scrollHeight<=e.clientHeight+1) continue; if(dir<0?e.scrollTop>0:e.scrollTop+e.clientHeight<e.scrollHeight-1) return e; } return null; };
  const hSc=n=>{ for(let e=n;e&&e!==document.body;e=e.parentElement){ if(/auto|scroll/.test(getComputedStyle(e).overflowX)&&e.scrollWidth>e.clientWidth+1) return e; } return null; };
  const canPull=t=>!busy&&!REORD&&!$("#shade")&&!$("#pzStage")&&!PZHOLD&&pageY()<=0&&!t.closest("input,textarea,select,.pz-hold,#tabbar,.pz-ghost")&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||"");
  const paint=d=>{ const p=Math.min(1,d/TH); el.style.transition="none"; el.style.opacity=d>0?Math.min(1,.3+p).toFixed(2):"0"; el.style.transform=`translate(-50%,${(HID+d).toFixed(1)}px)`; arc.style.strokeDasharray=`${p>=1?100:(p*82).toFixed(1)} 100`; svg.style.transform=`rotate(${(d*3.2).toFixed(0)}deg)`; el.classList.toggle("ready",p>=1); };
  const retract=()=>{ el.style.transition=""; el.classList.remove("ready"); el.style.opacity="0"; el.style.transform=`translate(-50%,${HID}px)`; };
  const refresh=()=>{ busy=true; el.style.transition=""; el.classList.remove("ready"); el.classList.add("spin"); arc.style.strokeDasharray=""; svg.style.transform=""; el.style.opacity="1"; el.style.transform=`translate(-50%,${HID+64}px)`;
    try{ sessionStorage.setItem("brader-ptr",JSON.stringify({v:VIEW,seg:PZSEG,t:PZT,prev:PZPREV})); }catch(e){}
    setTimeout(()=>location.reload(),520); };
  const end=ok=>{ const t=T; T=null; if(!t||!t.pull) return; if(ok&&t.d>=TH) refresh(); else retract(); };
  document.addEventListener("touchstart",e=>{ if(!on()) return; if(e.touches.length!==1){ end(false); return; } const t=e.touches[0], tg=e.target.nodeType===1?e.target:e.target.parentElement; T={x0:t.clientX,y0:t.clientY,y:t.clientY,axis:"",tg,ok:canPull(tg),pull:false,block:false,free:false,d:0,base:0}; },{passive:true,capture:true});
  document.addEventListener("touchmove",e=>{ if(!T||!on()) return; if(e.touches.length!==1){ end(false); return; }
    const t=e.touches[0], dx=t.clientX-T.x0, dy=t.clientY-T.y0, step=t.clientY-T.y, stop=()=>{ if(e.cancelable) e.preventDefault(); }; T.y=t.clientY;
    if(busy||REORD){ stop(); return; }
    if(!T.axis){ if(Math.abs(dx)<5&&Math.abs(dy)<5) return; T.axis=Math.abs(dx)>Math.abs(dy)?"x":"y";
      if(T.axis==="x") T.free=!!(T.tg.closest("input,textarea")||hSc(T.tg));
      else if(!mov(T.tg,dy>0?-1:1)){ if(T.ok&&dy>0){ T.pull=true; T.base=dy; const b=$("#topbar").getBoundingClientRect(); el.classList.remove("spin"); el.style.top=(b.height?b.bottom:0)+"px"; } else T.block=true; } }
    if(T.axis==="x"){ if(!T.free) stop(); return; }
    const m=step?mov(T.tg,step>0?-1:1):null;
    if(T.pull){ stop(); if(T.d<=0&&m){ m.scrollTop-=step; T.base+=step; return; } const raw=dy-T.base; T.d=raw>0?MAX*(1-Math.exp(-raw/120)):0; paint(T.d); return; }
    if(T.block){ stop(); if(m) m.scrollTop-=step; return; }
    if(step&&!m) stop();
  },{passive:false,capture:true});
  document.addEventListener("touchend",e=>{ if(!e.touches.length) end(true); },{passive:true,capture:true});
  document.addEventListener("touchcancel",()=>end(false),{passive:true,capture:true});
  document.addEventListener("focusout",()=>setTimeout(()=>{ if(on()&&window.scrollY) window.scrollTo(0,0); },120));
})();
/* 没网也能打开：只在正式网址注册，本地文件不用 */
if("serviceWorker" in navigator&&/(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
})();
// 跳到内容：键盘第一个 Tab 停在这里，按 Enter 直接到主要内容（不用 Tab 过整个侧边栏）
(function(){ const k=document.getElementById("skipLink"); if(k) k.addEventListener("click",e=>{ e.preventDefault(); const m=document.getElementById("main"); if(m){ m.focus({preventScroll:true}); m.scrollIntoView({block:"start"}); } }); })();
</script>
