<style>
/* Brader 财务目标 · C 风（有手感、会鼓励）
   浅奶油底（深色主题是深蓝底）、深蓝大卡片、珊瑚红 3D 主按钮、青绿 = 准时 / 存够、黄色 = 目标和庆祝。
   版面：电脑左边固定侧边栏 + 右边内容；≤960px 侧边栏变抽屉；≤760px 是手机版（底部分页，html.phone）。
   颜色变量：--coral 珊瑚红（品牌、线条、图标）、--teal 青绿（准时、进度）、--pri-bg 按钮底色、--acc-ink 珊瑚红当字用。
   字号只用 --fs-* 这几级（下面 :root），不要再写死 px。特效只在庆祝的时候（彩带、烟火、硬币、按住充能）。
   样式是一层一层加上去的：后面的区块会盖掉前面的，改之前先往下找有没有被盖掉。 */
:root{
  /* C 风·深色（深蓝底）。浅色是默认，在下面 html.light */
  --bg:#0E1626; --card:#172238; --card2:#1D2A43; --card3:#283754;
  --ink:#F4F1EA; --muted:#97A3BA; --faint:#6E7A93;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --coral:#FF6B5B; --coral-soft:rgba(255,107,91,.14); --teal:#2EC4A6; --teal-soft:rgba(46,196,166,.15);
  --good:#3DD6B5; --good-soft:rgba(46,196,166,.15); --warn:#F5B544; --warn-soft:rgba(245,181,68,.14); --bad:#FF6170; --bad-soft:rgba(255,97,112,.14);
  --gold:#FFC43D; --gold-soft:rgba(255,196,61,.14);
  --r-lg:22px; --r:16px; --r-sm:14px;
  /* 字号只有 6 级（2026-11-20）：说明小字 / 次要文字 / 内文 / 卡片标题 / 页标题和大数字 / 首页最大的数字。手机最小 13px */
  --fs-cap:12px; --fs-sm:14px; --fs-body:16px; --fs-title:20px; --fs-head:28px; --fs-hero:40px;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",Roboto,system-ui,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --ink2:#D3D9E4; --ink3:#E4E8EF; --hov:rgba(255,255,255,.04); --hov2:rgba(255,255,255,.07); --ghost-bg:#22304D;
  --side-bg:#111B2E; --top-bg:rgba(14,22,38,.92); --shade:rgba(5,9,18,.62); --scrim:rgba(5,9,18,.55); --sh:rgba(0,0,0,.6);
  --on-coral:#FFFFFF; --on-bad:#FFFFFF; --on-good:#06221B; --coral-hi:#FF8474; --bad-hi:#FF7A87; --marker:rgba(244,241,234,.75);
  --lav:#7FE3CF; --lav2:#7FE3CF; --sand:#FFD580; --shine:#fff; --rb-bg:#0E1626; --rb-ink:#fff; --axis:#7D89A3; --grid:rgba(255,255,255,.08);
  --acc-rgb:255,107,91; --acc2-rgb:46,196,166; --acc3-rgb:255,196,61; --sun:#FFC43D; --acc-ink:#FF7B6B;
  --pri-depth:#B9473A; --bad-depth:#B03745; --good-depth:#1A8A72; --btn2-bg:#24324F; --btn2-depth:#0A1221; --btn2-line:rgba(255,255,255,.1);
  --hero-bg:#1E2E4F; --hero-depth:#0A1221; --hero-track:#33466D; --inp-bg:#0E1626; --seg-bg:#111B2E; --seg-on:#283754; --tab-bg:rgba(17,27,46,.96);
  --card-sh:0 2px 0 rgba(0,0,0,.25);
  /* 不分深浅色的颜色：Logo「B」渐变、金币、进度条亮的那一头、黄色上面的字 */
  --brand-a:#FF6B5B; --brand-b:#FF9F43; --brand-depth:#B9473A; --teal-hi:#5CE1C4; --on-warn:#17120A;
  --coin-hi:#FFE9A8; --coin:#F5B544; --coin-lo:#C98A1E; --coin-depth:#9A6A12; --coin-ink:#5B3A00;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg);scrollbar-color:var(--line2) transparent}
body{background:var(--bg);color:var(--ink);font:var(--fs-body)/1.6 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
::selection{background:rgba(var(--acc-rgb),.28)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.gd{color:var(--good)!important}.wn{color:var(--warn)!important}.bd{color:var(--bad)!important}.cy{color:var(--coral)!important}.dim{color:var(--muted)}
.i{width:18px;height:18px;flex:none}
/* ---------- backdrop: faint static particles ---------- */
.space{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars{position:absolute;inset:0;width:100%;height:100%;opacity:.6}
/* ---------- layout ---------- */
.layout{position:relative;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:calc(22px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  background:var(--side-bg);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 22px}
.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:800;font-size:var(--fs-body);color:var(--on-coral);background:linear-gradient(135deg,var(--coral),var(--teal))}
.brand b{display:block;font-size:var(--fs-body);line-height:1.25}
.brand small{display:block;font-size:var(--fs-cap);color:var(--muted);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:42px;padding:9px 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:var(--fs-sm);text-align:left;transition:background .18s,color .18s}
.nav button:hover{background:var(--hov);color:var(--ink)}
.nav button[aria-current=page]{background:var(--coral-soft);color:var(--ink);font-weight:600}
.nav button[aria-current=page] .i{color:var(--coral)}
.nav .cnt{margin-left:auto;min-width:22px;padding:0 7px;border-radius:99px;background:var(--hov2);color:var(--muted);font:600 var(--fs-cap)/20px var(--f-num);text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:14px;border-top:1px solid var(--line)}
.side-foot .btn{width:100%;margin-bottom:6px}
.side-link{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:var(--fs-sm);text-align:left;transition:background .18s,color .18s}
.side-link:hover{background:var(--hov);color:var(--ink)}
.topbar{display:none}
.scrim{display:none}
.main{min-width:0;width:100%;max-width:1180px;padding:32px clamp(18px,3.2vw,40px) 64px}
.main:focus{outline:none}
/* Blur Fade (Magic UI): page entrance */
@keyframes fadeup{from{opacity:0;transform:translateY(6px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.main.enter>*{animation:fadeup .24s var(--ease) backwards}
.main.enter>*:nth-child(2){animation-delay:.03s}.main.enter>*:nth-child(3){animation-delay:.06s}.main.enter>*:nth-child(4){animation-delay:.09s}
.main.enter>*:nth-child(5){animation-delay:.12s}.main.enter>*:nth-child(n+6){animation-delay:.15s}
/* ---------- page header ---------- */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:6px 8px 6px 0;margin:-8px 0 8px;font-size:var(--fs-sm);min-height:36px}
.back:hover{color:var(--coral)}
.back .i{width:16px;height:16px}
.phead{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:16px 20px;flex-wrap:wrap;margin-bottom:22px}
.phead>div:first-child{min-width:0;flex:1 1 320px}
.phead h1{margin:0;font-size:var(--fs-head);font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:8px;color:var(--muted);font-size:var(--fs-sm)}
.meta b{color:var(--ink);font-weight:600}
.said{margin-top:6px;font-size:var(--fs-sm);color:var(--faint);overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 16px;border-radius:var(--r-sm);border:1px solid transparent;font-size:var(--fs-sm);font-weight:600;line-height:1.2;white-space:nowrap;
  transition:background .18s,border-color .18s,box-shadow .18s,transform .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--coral);color:var(--on-coral)}
.btn.pri:hover{background:var(--coral-hi)}
.btn.ghost{background:var(--ghost-bg);border-color:var(--line2);color:var(--ink);font-weight:500}
.btn.ghost:hover{background:rgba(var(--acc-rgb),.06);border-color:rgba(var(--acc-rgb),.42)}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.btn.danger:hover{background:var(--bad-hi)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:var(--fs-sm)}
.btn.lg{min-height:46px;padding:11px 22px;font-size:var(--fs-body)}
.btn.icon{width:40px;padding:0}
.linkbtn{border:0;background:none;color:var(--coral);padding:0;font:inherit;cursor:pointer}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;min-width:0;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 14px 30px -20px var(--sh)}
.card h2{margin:0;font-size:var(--fs-body);font-weight:600}
.card .sub,.sub{margin:4px 0 0;color:var(--muted);font-size:var(--fs-sm)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.mt{margin-top:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:var(--fs-cap);font-weight:600;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.paused{background:var(--hov2);color:var(--muted)}.pill.done{background:var(--gold-soft);color:var(--gold)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
/* next step */
.next{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:16px;padding:14px 18px;border-radius:var(--r);background:var(--card2);border:1px solid var(--line)}
.next .t{display:flex;gap:12px;align-items:flex-start;flex:1 1 300px;min-width:0}
.next .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--coral-soft);color:var(--coral)}
.next.warn .ic{background:var(--warn-soft);color:var(--warn)}.next.ok .ic{background:var(--good-soft);color:var(--good)}
.next b{display:block;font-size:var(--fs-sm);font-weight:600}
.next span{display:block;font-size:var(--fs-sm);color:var(--muted)}
/* progress card (Animated Circular Progress Bar) */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px 32px;align-items:center;padding:24px 26px}
.ring{position:relative;width:184px;height:184px;flex:none}
.ring svg{display:block;width:100%;height:100%;overflow:visible}
.ring .g1,.ring .g2{fill:none;stroke-width:8;stroke-linecap:round}
.ring .g2{stroke:var(--card3)}
.ring .g1{stroke:url(#gRing)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c b{font:700 var(--fs-hero)/1 var(--f-num);font-variant-numeric:tabular-nums}
.ring-c>span{margin-top:7px;font:var(--fs-cap)/1.3 var(--f-num);color:var(--muted)}
.ring.sm{width:76px;height:76px}
.ring.sm .g1,.ring.sm .g2{stroke-width:10}
.ring.sm .ring-c b{font-size:var(--fs-body)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
.hero .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
.fact{min-width:0}
.fact .l{font-size:var(--fs-cap);color:var(--muted)}
.fact .v{font:700 var(--fs-title)/1.35 var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fact .v .pill{font-size:var(--fs-sm);vertical-align:4px}
.fact .s{font-size:var(--fs-cap);color:var(--muted)}
.motto{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink2)}
.motto b{color:var(--ink);font-family:var(--f-num)}
/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;transition:transform .2s var(--ease),border-color .2s}
.kpi:hover{transform:translateY(-2px);border-color:var(--line2)}
.kpi .l{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--muted)}
.kpi .l em{font-style:normal;font-size:var(--fs-cap);letter-spacing:.12em;color:var(--faint)}
.kpi .v{margin-top:6px;font:700 var(--fs-title)/1.3 var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{margin-top:2px;font-size:var(--fs-cap);color:var(--muted)}
.kpi.hl .v{color:var(--coral)}
/* milestones */
.ms{padding:4px 2px 0}
.ms-track{position:relative;height:4px;margin:22px 10px 0;border-radius:99px;background:var(--card3)}
.ms-track>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--teal))}
.ms-node{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;padding:0;border-radius:50%;border:2px solid var(--line2);background:var(--card);transition:transform .15s,border-color .15s}
.ms-node:hover,.ms-node:focus-visible{transform:scale(1.15)}
.ms-node.on{background:var(--coral);border-color:var(--coral)}
.ms-node.nx{border-color:var(--coral);box-shadow:0 0 0 5px rgba(var(--acc-rgb),.16)}
.ms-tip{display:none;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);z-index:5;width:max-content;max-width:200px;padding:8px 11px;border-radius:10px;
  background:var(--card3);border:1px solid var(--line2);box-shadow:0 12px 26px -12px var(--sh);font-size:var(--fs-cap);line-height:1.5;color:var(--ink);text-align:left;white-space:normal;animation:fadeup .15s ease both;pointer-events:none}
.ms-tip b{font-family:var(--f-num)}
.ms-tip.t0{left:-6px;transform:none}.ms-tip.t3{left:auto;right:-6px;transform:none}
.ms-node:hover .ms-tip,.ms-node:focus-visible .ms-tip{display:block}
.ms-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.ms-item{min-width:0;text-align:right;font-size:var(--fs-cap);color:var(--muted)}
.ms-item b{display:block;font:600 var(--fs-sm)/1.4 var(--f-num);color:var(--ink)}
.ms-item .num{display:block;color:var(--ink2)}
.ms-item em{display:block;font-style:normal;overflow-wrap:anywhere}
.ms-item.done b,.ms-item.done em{color:var(--coral)}
.ms-item.atnext b{color:var(--coral)}
.ms-item.atnext em.c{color:var(--ink)}
/* 这个月要做的事 (goal page) */
.todo .chead{margin-bottom:6px}
.td-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.todo .chead+.td-row{border-top:0}
.td-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;align-self:start;background:var(--coral-soft);color:var(--coral)}
.td-row.td-ok .td-ic{background:var(--good-soft);color:var(--good)}
.td-row.td-warn .td-ic{background:var(--warn-soft);color:var(--warn)}
.td-main{min-width:0}
.td-main>b{display:block;font-size:var(--fs-sm);font-weight:600;line-height:1.45}
.td-main .d{display:block;margin-top:3px;font-size:var(--fs-sm);color:var(--muted)}
.td-main .d.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.td-main .bar{margin-top:8px;height:5px}
.td-row>.btn{white-space:nowrap}
@media (max-width:680px){ .kpis{display:none} }
/* goal rows (overview) */
.glist{display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:12px 8px;border:0;border-top:1px solid var(--line);border-radius:12px;background:none;text-align:left;transition:background .18s}
.grow:first-child{border-top-color:transparent}
.grow:hover{background:var(--hov)}
.grow:hover .gname{color:var(--coral)}
.gic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:var(--fs-title);background:var(--card2)}
.gmain{display:block;min-width:0}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:4px 8px;flex-wrap:wrap;margin-bottom:8px;min-width:0}
.gname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;transition:color .18s}
.gsub{display:block;margin-top:7px;font-size:var(--fs-cap);color:var(--muted);overflow-wrap:anywhere}
.gnum{text-align:right;white-space:nowrap}
.gnum b{display:block;font:700 var(--fs-title)/1.2 var(--f-num)}
.gnum span{font:var(--fs-cap)/1.4 var(--f-num);color:var(--muted)}
.bar{position:relative;display:block;height:6px;border-radius:99px;background:var(--card3)}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--teal))}
.bar>u{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:2px;background:var(--marker)}
.bar.time>i{background:var(--teal);opacity:.75}
/* goal cards (我的目标) */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.gcard{display:flex;flex-direction:column;gap:16px;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.gcard .top{display:flex;align-items:center;gap:12px;min-width:0}
.gcard .top>div{min-width:0;flex:1}
.gcard .top .gname{display:block}
.gcard .top small{display:block;font-size:var(--fs-cap);color:var(--muted)}
.gcard .mid{display:flex;align-items:center;gap:16px}
.gcard .kv{flex:1;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:var(--fs-sm)}
.gcard .kv .k{color:var(--muted)}
.gcard .kv .v{text-align:right;font-family:var(--f-num);overflow-wrap:anywhere}
.gcard.add{align-items:center;justify-content:center;min-height:190px;border-style:dashed;color:var(--muted);font-weight:600}
.gcard.add:hover{color:var(--coral)}
.gcard .warnline{font-size:var(--fs-cap);color:var(--warn)}
/* cash flow + health */
.flowhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.flowhead .l{display:block;font-size:var(--fs-cap);color:var(--muted)}
.flowhead b{font:700 var(--fs-title)/1.3 var(--f-num)}
.flowhead .r{text-align:right}
.alloc{display:flex;height:12px;margin:14px 0 10px;border-radius:99px;overflow:hidden;background:var(--card3)}
.alloc span{height:100%;box-shadow:inset -2px 0 0 var(--card)}
.allocleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-cap);color:var(--muted)}
.allocleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.say{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--card2);font-size:var(--fs-sm);color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-width:0;padding:12px 14px;border-radius:12px;background:var(--card2)}
.tile .l{display:flex;align-items:center;gap:7px;font-size:var(--fs-sm);color:var(--muted)}
.tile .v{margin-top:2px;font:700 var(--fs-title)/1.35 var(--f-num);font-variant-numeric:tabular-nums}
.tile .s{font-size:var(--fs-cap);color:var(--muted)}
/* quote */
.quote{margin:16px 0 0;padding:16px 20px;border-radius:var(--r);background:var(--teal-soft);border:1px solid rgba(var(--acc2-rgb),.3)}
.quote blockquote{margin:0;font-size:var(--fs-body);color:var(--ink3)}
.quote figcaption{margin-top:6px;font-size:var(--fs-cap);color:var(--muted)}
.note{margin-top:20px;font-size:var(--fs-cap);line-height:1.7;color:var(--faint)}
/* collapsible sections */
details.sec{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:14px 22px;cursor:pointer;font-size:var(--fs-body);font-weight:600;border-radius:var(--r-lg)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .hint{flex:1;font-size:var(--fs-sm);font-weight:400;color:var(--muted)}
details.sec>summary::after{content:"";flex:none;width:8px;height:8px;margin:0 4px 4px 0;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s var(--ease)}
details.sec[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
details.sec>summary:hover{color:var(--coral)}
details.sec>.body{padding:2px 22px 22px}
details.sec[open]>.body{animation:fadeup .2s var(--ease) backwards}
/* plan options */
.budget{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:var(--fs-sm)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);text-align:left;transition:border-color .18s,background .18s}
.opt:hover{border-color:var(--line2)}
.opt[aria-pressed=true]{border-color:rgba(var(--acc-rgb),.6);background:rgba(var(--acc-rgb),.07)}
.opt.dimmed{opacity:.6}
.opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2)}
.opt[aria-pressed=true] .radio{border-color:var(--coral);background:radial-gradient(var(--coral) 42%,transparent 47%)}
.opt .nm{font-weight:600}
.opt .ds{display:block;font-size:var(--fs-cap);color:var(--muted)}
.opt .rt{text-align:right;font-size:var(--fs-cap);color:var(--muted);white-space:nowrap}
.opt .rt b{display:block;font:700 var(--fs-body)/1.3 var(--f-num);color:var(--ink)}
.opt[aria-pressed=true] .rt b{color:var(--coral)}
.badge{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:6px;font-size:var(--fs-cap);font-weight:600;white-space:nowrap;vertical-align:1px}
.badge.rec{background:var(--coral-soft);color:var(--coral)}.badge.no{background:var(--bad-soft);color:var(--bad)}.badge.low{background:var(--warn-soft);color:var(--warn)}
.explain{margin-top:14px;padding:16px 18px;border-radius:12px;background:var(--card2);font-size:var(--fs-sm)}
.explain h3{margin:0 0 6px;font-size:var(--fs-sm)}
.explain p{margin:4px 0}
.explain dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 16px;margin:10px 0 0;font-size:var(--fs-sm)}
.explain dt{color:var(--muted)}.explain dd{margin:0}
.explain dd b{color:var(--good);font-family:var(--f-num)}
.explain .q{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--teal-soft);color:var(--ink2)}
.h3{margin:22px 0 4px;font-size:var(--fs-body);font-weight:600}
.faster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.fast{padding:12px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.fast .h{font-size:var(--fs-sm);color:var(--muted)}
.fast .v{font:700 var(--fs-body)/1.4 var(--f-num);color:var(--good)}
.fast .d{font-size:var(--fs-cap);color:var(--muted)}
/* steps */
.stephd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stephd .bar{flex:1}
.stephd b{font:600 var(--fs-sm)/1 var(--f-num);color:var(--coral)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:2px 0 0;border-radius:6px;border:1.5px solid var(--line2);background:var(--bg);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.steps input::after{content:"";width:5px;height:10px;margin-top:-3px;border:solid var(--on-coral);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .15s}
.steps input:checked{background:var(--coral);border-color:var(--coral)}
.steps input:checked::after{transform:rotate(45deg) scale(1)}
.steps label{cursor:pointer;min-width:0}
.steps .h{font-weight:500}
.steps .d{display:block;margin-top:2px;font-size:var(--fs-sm);color:var(--muted)}
.steps li.ok .h{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(var(--acc-rgb),.5)}
/* analysis */
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 6px;font-size:var(--fs-cap);color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;margin-right:6px;border-radius:2px;vertical-align:3px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.anal{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.vs{display:grid;gap:10px;margin:6px 0 14px}
.vsr{display:grid;grid-template-columns:64px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:var(--fs-sm);color:var(--muted)}
.vsr b{text-align:right;font-family:var(--f-num);color:var(--ink)}
.verdict{margin:0 0 12px;padding:9px 12px;border-radius:10px;background:var(--card2);font-size:var(--fs-sm)}
.flist{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-sm);color:var(--muted)}
.flist b{color:var(--ink);font-family:var(--f-num);font-weight:600}
/* notes + log */
textarea{width:100%;min-height:96px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--bg);color:var(--ink);resize:vertical;outline:none;transition:border-color .18s,box-shadow .18s}
textarea:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.14)}
.log{list-style:none;margin:0;padding:0;font-size:var(--fs-sm)}
.log li{display:grid;grid-template-columns:92px minmax(0,1fr) auto 34px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log .d{font-family:var(--f-num);color:var(--muted)}
.log .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.log b{font-family:var(--f-num);font-weight:600}
.log b.in{color:var(--good)}.log b.out{color:var(--bad)}
.log .del{width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:var(--fs-body)}
.log .del:hover{background:var(--bad-soft);color:var(--bad)}
/* more-actions menu */
.more{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:15;min-width:184px;padding:6px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);box-shadow:0 18px 40px -16px var(--sh);animation:pop .16s var(--ease) both}
.menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 12px;border:0;border-radius:8px;background:none;color:var(--ink);font-size:var(--fs-sm);text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--hov2);outline:none}
.menu button.danger{color:var(--bad)}
.menu hr{margin:4px 2px;border:0;border-top:1px solid var(--line)}
/* tips (in-page notices) */
.tip{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;border-radius:var(--r);background:var(--card2);border:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink2)}
/* trophies */
.hallhead{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.hallhead .l{font-size:var(--fs-cap);color:var(--muted)}
.hallhead .v{font:700 var(--fs-head)/1.3 var(--f-num);color:var(--gold)}
.hall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.trophy .medal{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:var(--fs-title);margin-bottom:12px;background:var(--good-soft);border:1px solid rgba(var(--acc2-rgb),.25)}
.trophy h3{margin:0;font-size:var(--fs-body)}
.trophy .amt{margin:4px 0 2px;font:700 var(--fs-title)/1.3 var(--f-num);color:var(--gold)}
.trophy .s{font-size:var(--fs-sm);color:var(--muted)}
.trophy .early{color:var(--good);font-weight:600}
.trophy .acts{margin-top:12px}
.pcard{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pcard .who{display:flex;gap:12px;align-items:center;min-width:0}
.list{display:grid;gap:12px}
/* empty / welcome */
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty h2{margin:12px 0 6px;font-size:var(--fs-title);color:var(--ink)}
.empty .big{width:48px;height:48px;margin:0 auto;border-radius:14px;display:grid;place-items:center;background:var(--card2);color:var(--coral)}
.empty .big .i{width:24px;height:24px}
.welcome{padding:48px 28px;text-align:center}
.welcome .mark{width:56px;height:56px;margin:0 auto;border-radius:16px;font-size:var(--fs-title)}
.welcome h1{margin:18px 0 8px;font-size:var(--fs-head)}
.welcome .lead{max-width:520px;margin:0 auto;color:var(--muted)}
.welcome .chips{justify-content:center;margin:22px 0 24px}
/* ---------- modal ---------- */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes popout{from{opacity:1;transform:none}to{opacity:0;transform:translateY(6px) scale(.98)}}
.shade{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--shade);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fadein .2s ease both}
.shade.closing{animation:fadeout .15s ease both}
.modal{position:relative;display:flex;flex-direction:column;width:100%;max-width:520px;max-height:min(90vh,880px);background:var(--card);border:1px solid var(--line2);border-radius:18px;box-shadow:0 30px 80px -24px var(--sh);animation:pop .2s var(--ease) both}
.shade.closing .modal{animation:popout .15s ease both}
.modal form{display:flex;flex-direction:column;min-height:0;flex:1}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 8px}
.mhead h2{margin:0;font-size:var(--fs-title)}
.mhead p{margin:4px 0 0;font-size:var(--fs-sm);color:var(--muted)}
.x{width:36px;height:36px;margin:-6px -8px 0 0;flex:none;border:0;border-radius:9px;background:none;color:var(--muted);font-size:var(--fs-title);line-height:1}
.x:hover{background:var(--hov2);color:var(--ink)}
.mbody{padding:10px 22px 6px;overflow-y:auto;min-height:0}
.mfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line);margin-top:6px}
.ctext{margin:4px 0 8px;font-size:var(--fs-body)}
.ctext+p{margin:0 0 6px;color:var(--muted);font-size:var(--fs-sm)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.flabel{font-size:var(--fs-sm);color:var(--muted)}
.opt-t{color:var(--faint)}
.inp{display:flex;align-items:center;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--bg);transition:border-color .18s,box-shadow .18s}
.inp:focus-within{border-color:var(--coral);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.14)}
.inp span{padding-left:12px;font-size:var(--fs-sm);color:var(--muted)}
.inp input,.inp select{flex:1;min-width:0;min-height:42px;padding:9px 12px;border:0;background:transparent;color:var(--ink);font-size:var(--fs-body);outline:none}
.inp input[type=number]{font-family:var(--f-num)}
.inp select option{background:var(--card);color:var(--ink)}
.field.err .inp{border-color:var(--bad)}
.ferr{font-size:var(--fs-cap);color:var(--bad)}
.ferr:empty{display:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.row{display:flex;gap:8px}
.row .inp{flex:1;min-width:0}
.seg{display:flex;gap:4px;margin-bottom:14px;padding:4px;border-radius:11px;background:var(--bg);border:1px solid var(--line)}
.seg button{flex:1;min-height:36px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:var(--fs-sm);transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--card2);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:32px;padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-size:var(--fs-sm);transition:border-color .18s,color .18s,background .18s}
.chip:hover{border-color:var(--coral);color:var(--coral);background:var(--coral-soft)}
.quick{margin-bottom:16px;padding:14px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.quick .chips{margin-top:10px}
.quick .flabel{display:block;margin-bottom:6px}
.est{margin:12px 0 0;font-size:var(--fs-sm)}
.est dl{display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px 12px;margin:0}
.est dt{color:var(--muted)}.est dd{margin:0;overflow-wrap:anywhere}
.calc{margin:2px 0 14px;padding:12px 14px;border-radius:12px;background:var(--card2);font-size:var(--fs-sm)}
.calc:empty{display:none}
.calc .ok{color:var(--good)}
.cur{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--card2);font-size:var(--fs-sm);color:var(--muted)}
.cur b{color:var(--ink);font-family:var(--f-num)}
.uprev{margin:0 0 14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font-size:var(--fs-sm);color:var(--muted)}
.uprev b{color:var(--ink);font-family:var(--f-num)}
.uprev .bar{margin-top:8px}
.uprev .bar s{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--good);text-decoration:none}
.field .linkbtn{align-self:flex-start;font-size:var(--fs-sm)}
.bk{display:flex;gap:8px;flex-wrap:wrap}
/* toast */
#toastRoot{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(6px)}}
.toast{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);box-shadow:0 14px 34px -14px var(--sh);font-size:var(--fs-sm);animation:toastin .2s var(--ease) both}
.toast.out{animation:toastout .18s ease both}
.toast i{width:18px;height:18px;flex:none;display:grid;place-items:center;border-radius:50%;font:800 var(--fs-cap)/1 var(--f-body);font-style:normal}
.toast.ok i{background:var(--good);color:var(--on-good)}.toast.err i{background:var(--bad);color:var(--on-bad)}.toast.info i{background:var(--coral);color:var(--on-coral)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
/* ================= 特效（只在 <html class="fx">；「简洁」全部关掉）：平常只剩卡片光、页面淡入、按钮小涟漪；彩带、烟火、硬币这些庆祝在 JS ================= */
.comet{display:none}
.fx .comet{display:block;position:absolute;top:50%;z-index:3;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--coin-hi),var(--coin) 60%,var(--coin-lo));box-shadow:0 2px 0 var(--coin-depth);pointer-events:none}
.mark{position:relative}
/* brand + nav */
.fx .brand .mark::before{content:"";position:absolute;inset:-6px;border-radius:14px;border:1px dashed rgba(var(--acc-rgb),.4)}
/* Magic Card: spotlight that follows the mouse */
.card,.kpi{position:relative}
.fx .card,.fx .kpi{isolation:isolate}
.fx .card::before,.fx .kpi::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(420px circle at var(--mx,-999px) var(--my,-999px),rgba(var(--acc-rgb),.11),transparent 45%)}
.fx .card::after,.fx .kpi::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--mx,-999px) var(--my,-999px),rgba(var(--acc-rgb),.8),rgba(var(--acc2-rgb),.45) 40%,transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.fx .card:hover::before,.fx .card:hover::after,.fx .kpi:hover::before,.fx .kpi:hover::after{opacity:1}
.hallhead>div,.trophy .medal,.welcome .mark{position:relative}
/* Blur Fade, a bit longer in 酷炫 */
.fx .main.enter>*{animation-duration:.5s}
.fx .main.enter>*:nth-child(2){animation-delay:.07s}.fx .main.enter>*:nth-child(3){animation-delay:.14s}.fx .main.enter>*:nth-child(4){animation-delay:.21s}
.fx .main.enter>*:nth-child(5){animation-delay:.28s}.fx .main.enter>*:nth-child(n+6){animation-delay:.34s}
/* Cool Mode particles */
#coolfx{position:fixed;inset:0;z-index:70;overflow:hidden;pointer-events:none}
#coolfx i{position:absolute;left:0;top:0;border-radius:50%;will-change:transform,opacity}
/* the 特效 switch */
.fxsw{position:relative}
.fxsw .sw{margin-left:auto;position:relative;flex:none;width:34px;height:20px;border-radius:99px;background:var(--card3);transition:background .2s}
.fxsw .sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}

/* ================= 更多特效（第二批，Magic UI）+ 尺寸 ================= */
@keyframes typein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes hlsweep{to{background-size:100% 42%}}
@keyframes listin{from{opacity:0;transform:translateX(-16px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* Typing Animation (motivation line) + Highlighter (key numbers) */
.fx .main.enter .motto{animation:typein 1.4s steps(40,end) .35s backwards}
.fx .hlt{border-radius:3px;padding:0 2px;background:linear-gradient(100deg,rgba(var(--acc-rgb),0),rgba(var(--acc-rgb),.4) 8%,rgba(var(--acc2-rgb),.4) 92%,rgba(var(--acc2-rgb),0)) no-repeat 0 90%/0% 42%;animation:hlsweep .7s ease-out 1.3s forwards}
/* Animated List */
.fx .main.enter .glist>*,.fx .main.enter .gcards>*{animation:listin .45s var(--ease) backwards}
.fx .main.enter .glist>*:nth-child(2),.fx .main.enter .gcards>*:nth-child(2){animation-delay:.08s}
.fx .main.enter .glist>*:nth-child(3),.fx .main.enter .gcards>*:nth-child(3){animation-delay:.16s}
.fx .main.enter .glist>*:nth-child(4),.fx .main.enter .gcards>*:nth-child(4){animation-delay:.24s}
.fx .main.enter .glist>*:nth-child(5),.fx .main.enter .gcards>*:nth-child(5){animation-delay:.32s}
.fx .main.enter .glist>*:nth-child(n+6),.fx .main.enter .gcards>*:nth-child(n+6){animation-delay:.4s}
/* Ripple Button */
.fx .btn{position:relative;overflow:hidden}
.rip{position:absolute;width:var(--d);height:var(--d);border-radius:50%;background:rgba(255,255,255,.38);transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:rip .6s ease-out forwards}

/* Animated Subscribe Button: 确认更新 → ✓ 已更新 */

/* 减少动画（系统设定）：不移动、不弹跳，但保留很短的淡入淡出和有用的反馈（撤销的倒数条、颜色变化） */
@media (prefers-reduced-motion:reduce){
  @keyframes rmfade{from{opacity:0}}
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-property:color,background-color,border-color,opacity,box-shadow,fill,stroke!important;transition-duration:.15s!important;scroll-behavior:auto!important}
  .main.enter>*,.modal,.shade,.toast,.menu,details.sec[open]>.body,.ans.pop,.pz-stage,.ms-tip{animation:rmfade .18s ease both!important}
  .toast.out,.shade.closing,.shade.closing .modal,.pz-stage.out{animation:fadeout .15s ease both!important}
  .tbar{animation:tbar var(--tms,5s) linear forwards!important}
  #pzPtr.spin svg{animation:pzptr .75s linear infinite!important}
}

html.phone :is(.btn,.qamt,.qadd,.chip,.pz-tile,.pz-switch,.pz-next,.x).pz-pressed{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral)}

/* 换页 */

.pz-exp{position:relative;z-index:7;min-height:100vh;background:var(--bg)}

/* 弹窗 */
html.phone .mfoot [hidden]{display:none!important}
html.phone:has(#shade) #toastRoot{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto} /* 窗口开着时提示移到最上面，不挡住按住的按钮 */
html.phone.fx .modal{box-shadow:0 30px 80px -24px var(--sh),0 40px 0 0 var(--card);animation:pzspring .46s cubic-bezier(.22,.8,.3,1) backwards}
@keyframes pzspring{0%{transform:translateY(100%)}45%{transform:translateY(-1.6%)}70%{transform:translateY(.5%)}100%{transform:translateY(0)}}

@keyframes pzmorph{from{clip-path:circle(26px at var(--mx) var(--my))}to{clip-path:circle(150vmax at var(--mx) var(--my))}}
html.phone.fx .shade.closing .modal.pz-morph{animation:pzmorphout .23s ease-in forwards}
@keyframes pzmorphout{from{clip-path:circle(150vmax at var(--mx) var(--my))}to{clip-path:circle(26px at var(--mx) var(--my))}}
/* 按住充能 */
.pz-hb{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.pz-sel{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:8px;margin:0;font-size:var(--fs-sm);color:var(--muted)}
.pz-sel>b{font:800 var(--fs-head)/1.2 var(--f-num);color:var(--coral)}
.pz-hold{position:relative;flex:none;display:grid;place-items:center;width:104px;height:104px;padding:0;border:0;border-radius:50%;background:radial-gradient(circle at 50% 32%,var(--card3),var(--card2));color:var(--ink);cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.34,1.7,.5,1),box-shadow .2s ease}
.pz-hold svg{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.pz-hold circle{fill:none}
.pz-hold .t{stroke:var(--line2);stroke-width:5}
.pz-hold .p{stroke:url(#gRing);stroke-width:7;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.pz-hold.back .p{transition:stroke-dashoffset .24s ease}
.pz-hc{display:flex;flex-direction:column;align-items:center;font-size:var(--fs-body);line-height:1.25;pointer-events:none}
.pz-hc b{font-weight:800}
.pz-hold.shake{animation:pzshake .34s ease}
@keyframes pzshake{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}90%{transform:translateX(2px)}}
.pz-tapbtn{width:100%;min-height:52px}
.pz-tip{min-height:20px;margin:0;font-size:var(--fs-sm);line-height:20px;font-weight:600;color:var(--warn);text-align:center}
/* 存入之后的画面 */
.pz-stage{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:24px;background:var(--shade);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);text-align:center;touch-action:none;animation:fadein .16s ease both}
.pz-stage.out{animation:fadeout .18s ease both;pointer-events:none}
.pz-st-c{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;max-width:330px}
.pz-st-r{width:172px;height:172px}
.pz-st-r .ring-c b{font-size:var(--fs-hero)}
.pz-st-n{margin:14px 0 0;font-size:var(--fs-body);font-weight:600;color:var(--ink2);overflow-wrap:anywhere}
.pz-st-a{min-height:32px;margin:0;font:800 var(--fs-head)/32px var(--f-num);color:var(--good)}
.pz-st-h{min-height:30px;margin:6px 0 0;font-size:var(--fs-title);line-height:1.45;font-weight:800;color:var(--ink);white-space:pre-line;overflow-wrap:anywhere;opacity:0;transform:translateY(10px) scale(.92);transition:opacity .22s ease,transform .36s cubic-bezier(.34,1.7,.5,1)}
.pz-stage.lv3 .pz-st-h{font-size:var(--fs-head);line-height:1.3;background:linear-gradient(135deg,var(--coral),var(--teal),var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
.pz-stage.peak .pz-st-h{opacity:1;transform:none}
.pz-coin{position:fixed;left:0;top:0;z-index:46;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--coin-hi),var(--coin) 62%,var(--coin-lo));box-shadow:0 2px 0 var(--coin-depth);color:var(--coin-ink);font:800 var(--fs-cap)/1 var(--f-num);font-style:normal;pointer-events:none;will-change:transform,opacity}
@media (max-height:640px){.pz-hold{width:84px;height:84px}.pz-hc{font-size:var(--fs-body)}.pz-sel>b{font-size:var(--fs-title)}}
@media (prefers-reduced-motion:reduce){html.phone .pz-pressed{transform:none}}
.pz-tile.over{border-color:var(--warn)}
.pz-tile.over small{color:var(--warn);font-weight:600}
.ares .ah{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:var(--fs-cap);line-height:1.55;color:var(--muted)}
.ares .ah b{color:var(--ink2);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* 手机上的按钮至少 44px，手指才按得准 */
html.phone .qadd{position:relative}
html.phone .qadd:not(.oncard){width:44px;height:44px}
html.phone .btn.sm{min-height:44px;min-width:44px}
html.phone .modal .x{width:44px;height:44px}

html.phone .linkbtn{position:relative}
html.phone .linkbtn::after{content:"";position:absolute;inset:-12px -15px}
.ms-node::after{content:"";position:absolute;inset:-13px} /* 节点看起来 18px，按得到的范围 44px */
html.phone .topbar .btn.icon{width:44px;min-height:44px;height:44px}
html.phone .pz-seg button,html.phone .seg button{min-height:44px}
html.phone .qitem{padding-top:11.5px;padding-bottom:11.5px}
html.phone .log .del{width:44px;height:44px}
html.phone .inp input,html.phone .inp select{min-height:44px}
html.phone .steps li{position:relative}
html.phone .steps label::before{content:"";position:absolute;inset:0}
/* 手机版整页固定：只有中间内容会滑，到顶到底都不回弹 */
html.phone,html.phone body{height:100%;overflow:hidden;overscroll-behavior:none}
html.phone body{position:fixed;inset:0;width:100%;min-height:0;display:flex;flex-direction:column;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html.phone .topbar{position:relative;top:auto;flex:none}
html.phone .layout{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none}
html.phone .pz-gtop{top:0}
html.phone .mbody,html.phone .tscroll{overscroll-behavior:none}
html.phone .qlist{overscroll-behavior:auto}
html.phone .pz-exp{min-height:100%}
html.phone.pz-new .pz-welcome{min-height:calc(100vh - 36px - env(safe-area-inset-top,0px));min-height:calc(100dvh - 36px - env(safe-area-inset-top,0px))}
#pzPtr{display:none}
html.phone #pzPtr{display:grid;place-items:center;position:fixed;left:50%;top:0;z-index:19;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:linear-gradient(var(--card),var(--card)),var(--bg);box-shadow:0 6px 18px rgba(0,0,0,.32);opacity:0;transform:translate(-50%,-52px);transition:transform .22s var(--ease),opacity .18s,box-shadow .15s;pointer-events:none}
#pzPtr svg{width:26px;height:26px;transform-origin:50% 50%}
#pzPtr circle{fill:none;stroke-width:2.4}
#pzPtr .pt{stroke:var(--line)}
#pzPtr .pa{stroke:var(--coral);stroke-linecap:round;stroke-dasharray:0 100}
#pzPtr.ready{box-shadow:0 6px 18px rgba(0,0,0,.32),0 0 0 3px var(--coral-soft)}
#pzPtr.spin .pa{stroke-dasharray:64 100}
#pzPtr.spin svg{animation:pzptr .75s linear infinite}
@keyframes pzptr{to{transform:rotate(360deg)}}
@media print{html.phone,html.phone body{position:static;display:block;height:auto;overflow:visible}html.phone .layout{overflow:visible}}
/* ---------- 先后顺序：排名、拖动、晚几个月 ---------- */
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.rk{flex:none;min-width:22px;height:22px;padding:0 6px;display:inline-grid;place-items:center;border-radius:99px;background:var(--coral-soft);color:var(--coral);font:700 var(--fs-cap)/1 var(--f-num)}
#gOrder .gcwrap{cursor:grab;touch-action:manipulation}
#gOrder .gcwrap .gcard{cursor:inherit}
.pz-rows .pz-rw{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.reord,html.reord *{cursor:grabbing!important;-webkit-user-select:none!important;user-select:none!important}
.rph{opacity:.32;outline:2px dashed var(--line2);outline-offset:-2px;border-radius:var(--r-lg)}
.rph .card{box-shadow:none}
.rghost{position:fixed!important;z-index:90;margin:0!important;pointer-events:none;opacity:.96;box-shadow:0 22px 46px -16px var(--sh),0 0 0 2px var(--coral);border-radius:var(--r-lg);background:var(--card);transition:none!important;will-change:transform}
.rghost .tilt,.rghost .card{transform:none!important}
.pz-rw.rghost{border-top:0;border-radius:14px}
.rghost .pz-act{display:none}
.pz-rw:not(.open):not(.sw) .pz-act{visibility:hidden;transition:visibility 0s .22s} /* 没滑开时藏起来：不会被 Tab 到、也不会被读屏念到 */
.pz-lt b .pill{white-space:normal;max-width:100%;border-radius:10px}
.rghost .pz-row{transform:none!important}
.rlift{animation:rlift .3s var(--ease)}
@keyframes rlift{40%{transform:scale(1.02)}}
.pz-rm .rk{margin-right:-2px}
.pz-dic{flex:none;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:var(--card2);font-size:var(--fs-title)}
.pz-lt b [data-lt] .pill{margin-left:2px;vertical-align:1px;font-size:var(--fs-cap);padding:0 8px}
.gdebt .kv{grid-template-columns:auto minmax(0,1fr)}
.gdebt .mid{min-height:86px}
.forder{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:2px}
.forder li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:var(--fs-sm)}
.forder li:first-child{border-top:0}
.forder .fn{min-width:0;overflow-wrap:anywhere}

.forder .fa small{color:var(--muted);font-size:var(--fs-cap)}
.forder .ft{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--fs-cap);color:var(--muted)}
.forder .ft:empty{display:none}
.forder li.fleft{color:var(--muted)}
.fev{margin:10px 0 0;padding:0;list-style:none;font-size:var(--fs-sm);color:var(--ink2)}

.flowtip{margin:0 0 16px;padding:12px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink2)}
.flowtip.warn{border-color:rgba(var(--acc3-rgb),.45);background:var(--warn-soft)}
.flowtip.good{border-color:rgba(var(--acc2-rgb),.3);background:var(--good-soft)}
.flowtip .fbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rkpick{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rkpick .inp{width:auto;min-width:150px}
.rkout{margin:6px 0 0;font-size:var(--fs-sm);line-height:1.55}
.rkout ul{margin:4px 0 0;padding-left:18px}
/* ================= C 风：有手感、会鼓励（2026-11-19） =================
   暖白底（深色是深蓝底）、深蓝大卡片、珊瑚红主色、青绿 = 准时 / 存够、黄色 = 目标和庆祝。
   只有按钮有底部厚度，按下去会陷下去；卡片、金额选项、＋、分页保持平的。
   特效全部留着，换成 C 风：飘的小硬币和圆点、暖色光、圆点地板、彩带、彩色流动线。 */
body{background:var(--bg)}
::selection{background:rgba(var(--acc-rgb),.22)}
:focus-visible{outline-color:var(--coral)}
/* ---------- 卡片：平的，柔和的阴影 ---------- */
.card,.kpi,details.sec,.quote,.next,.pz-tile{box-shadow:var(--card-sh)}
.card:hover,.kpi:hover{transform:none;box-shadow:var(--card-sh)}
.gcard:hover,.trophy:hover{transform:translateY(-2px);box-shadow:var(--card-sh),0 16px 30px -22px var(--sh)}
.card h2{font-weight:700}
.phead h1{font-weight:800;letter-spacing:-.01em}
.fact .v,.kpi .v,.flowhead b,.pz-big,.ring-c b,.qamt>b,.opt .rt b,.pz-amt,.pz-sel>b{font-weight:800}
/* ---------- 深蓝大卡片（总览、目标页、手机首页、还债） ---------- */
.card.hero,.pz-hero,.pz-dh{--card:var(--hero-bg);--card2:rgba(255,255,255,.07);--card3:var(--hero-track);--ink:#FFFFFF;--ink2:#DDE5F2;--ink3:#EEF2F8;--muted:#A9B8D4;--faint:#8C9CBD;
  --line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.22);--good:#5CE1C4;--coral:#FF7B6B;--acc-ink:#FF8E80;--hov:rgba(255,255,255,.06);--warn:#FFC266;
  background:var(--hero-bg);color:#fff;border-color:transparent;box-shadow:0 6px 0 var(--hero-depth)}
.card.hero:hover,.pz-hero:hover{box-shadow:0 6px 0 var(--hero-depth)}
:root .fx .hero,:root .fx .hero:hover{box-shadow:0 6px 0 var(--hero-depth),0 24px 50px -32px rgba(var(--acc-rgb),.55)}
.hero .motto{border-top-color:rgba(255,255,255,.12)}
/* ---------- 按钮：有厚度，按下去会陷下去 ---------- */
.btn{--d:4px;border-radius:14px;font-weight:700;letter-spacing:.01em;transition:transform .08s ease,box-shadow .08s ease,background .15s,filter .15s}
.btn.sm{--d:3px;border-radius:12px}
.btn.lg{--d:5px;border-radius:16px;font-size:var(--fs-body)}
:root .btn.pri{background:var(--pri-bg);color:var(--on-coral);border-color:transparent;box-shadow:0 var(--d) 0 var(--pri-depth)}
:root .btn.pri:hover{background:var(--pri-hi);box-shadow:0 var(--d) 0 var(--pri-depth)}
:root .btn.ghost{background:var(--btn2-bg);border:1px solid var(--btn2-line);color:var(--ink);font-weight:700;box-shadow:0 var(--d) 0 var(--btn2-depth)}
:root .btn.ghost:hover{background:var(--btn2-bg);border-color:var(--btn2-line);filter:brightness(1.04)}
:root .btn.danger{background:var(--bad);color:var(--on-bad);box-shadow:0 var(--d) 0 var(--bad-depth)}
:root .btn.danger:hover{background:var(--bad-hi);box-shadow:0 var(--d) 0 var(--bad-depth)}
:root .btn.doneok{background:var(--teal)!important;color:var(--on-coral)!important;box-shadow:0 var(--d) 0 var(--good-depth)!important}
:root .btn:not(:disabled):active,:root .btn.pz-pressed{transform:translateY(calc(var(--d) - 1px))}
:root .btn.pri:not(:disabled):active,:root .btn.pri.pz-pressed{box-shadow:0 1px 0 var(--pri-depth)}
:root .btn.ghost:not(:disabled):active,:root .btn.ghost.pz-pressed{box-shadow:0 1px 0 var(--btn2-depth);border-color:var(--btn2-line)}
:root .btn.danger:not(:disabled):active,:root .btn.danger.pz-pressed{box-shadow:0 1px 0 var(--bad-depth)}
.btn:disabled{box-shadow:none!important;transform:none!important}
.linkbtn{color:var(--acc-ink);font-weight:600}
.back:hover{color:var(--acc-ink)}
/* 新目标（侧边栏）：彩色、有厚度 */
:root #addBtn{box-shadow:0 var(--d) 0 var(--pri-depth)}
/* ---------- 平的小东西：金额选项、＋、分页、菜单 ---------- */
.qamt{border-radius:14px;background:var(--card);border:1.5px solid var(--line2)}
.qamt:hover,.qamt:focus-visible{border-color:var(--coral);background:var(--coral-soft)}
.qamt[aria-pressed=true]{border-color:var(--coral);background:var(--coral-soft)}
.qamt[aria-pressed=true]>b{color:var(--acc-ink)}
.qamt.full{border-color:rgba(var(--acc2-rgb),.55)}
.chip{border-radius:12px;border-width:1.5px;font-weight:600}
.chip:hover{border-color:var(--coral);color:var(--acc-ink)}
.qadd{border-radius:12px;background:var(--card);border:1.5px solid var(--line2);color:var(--coral)}
.qadd:hover{background:var(--coral-soft);border-color:var(--coral)}
.seg{background:var(--seg-bg);border:0;border-radius:14px}
.seg button{border-radius:10px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--seg-on);box-shadow:0 2px 0 var(--line2)}
.pz-seg{background:var(--seg-bg);border-radius:14px}
.pz-seg button{border-radius:10px}
.pz-seg button[aria-selected=true]{background:var(--seg-on);color:var(--ink);box-shadow:0 2px 0 var(--line2)}
.opt{border-radius:14px;background:var(--card);border-width:1.5px}
.opt[aria-pressed=true]{border-color:var(--coral);background:var(--coral-soft)}
.side{border-right-color:var(--line)}
.nav button{border-radius:12px;font-weight:600}
.nav button[aria-current=page]{background:var(--coral-soft);color:var(--acc-ink)}
.nav button[aria-current=page] .i{color:var(--coral)}
.side-link{border-radius:12px}
.mark{background:linear-gradient(135deg,var(--brand-a),var(--brand-b));color:var(--on-coral)}
.fx .brand .mark{box-shadow:0 3px 0 var(--brand-depth)}
.fxsw[aria-checked=true] .sw{background:var(--teal)}
.cnt{font-weight:700}
/* ---------- 输入框、窗口、提示 ---------- */
.inp{border-radius:14px;background:var(--inp-bg);border-width:1.5px}
textarea{border-radius:14px;background:var(--inp-bg)}
.modal{border-radius:24px;background:var(--card)}
html.phone .modal{border-radius:24px 24px 0 0}
.toast{border-radius:14px;background:var(--card);box-shadow:0 12px 30px -14px var(--sh)}
.toast.ok i{background:var(--teal);color:var(--on-coral)}
.ms-tip,.ch-tip{background:var(--card);box-shadow:0 12px 26px -12px var(--sh)}
/* ---------- 圆环、进度条、里程碑：青绿，黄色金币 ---------- */
.ring .g2{stroke:var(--card3)}
.ring-c b{color:var(--ink)}
/* 彩色流动的百分比只放在深蓝大卡片的大圆环（白底上的小圆环用实色字，看得清楚） */
.bar{height:8px}
.bar>i{background:linear-gradient(90deg,var(--teal),var(--teal-hi))}
.ms-track{height:6px}
.ms-track>i{background:linear-gradient(90deg,var(--teal),var(--teal-hi))}

  const id=++TOAST_ID, ms=opt.ms||2400;
  const el=document.createElement("div"); el.className="toast "+kind+(opt.action?" act":""); el.setAttribute("role",kind==="err"?"alert":"status");
  el.innerHTML=`<i aria-hidden="true">${kind==="err"?"!":kind==="info"?"i":"✓"}</i><span></span>${opt.action?`<button class="tact" type="button"></button>${opt.next?'<button class="tact tnext" type="button"></button>':""}<span class="tbar" aria-hidden="true" style="--tms:${ms}ms"></span>`:""}`;
  el.querySelector("span").textContent=t;
  if(opt.action){ const b=el.querySelector(".tact"); b.textContent=opt.action; b.onclick=()=>{ el.remove(); opt.fn(); }; }
  if(opt.action&&opt.next){ const b=el.querySelector(".tnext"); b.textContent=opt.next.l; b.setAttribute("aria-label",opt.next.t); b.onclick=()=>{ el.remove(); opt.next.fn(); }; }
  root.appendChild(el);

const MEM=new Map();
function tween(from,to,dur,step){
  if(REDUCE.matches||from===to||!isFinite(from)||!isFinite(to)){ step(to); return; }
  const t0=performance.now(); step(from);
  const f=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); step(from+(to-from)*e); if(k<1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
const FMT={rm:v=>rm(v),pct:v=>Math.round(v)+"%",int:v=>String(Math.round(v))};
// gauge: primary arc = progress, secondary arc = what is left, with a small gap between them (like Magic UI's gauge)
const RC=2*Math.PI*45, GAP=5;
function setGauge(el,v){
  const pc=Math.max(0,Math.min(100,v*100)), gap=pc>0.5&&pc<99.5?GAP:0, rest=Math.max(0,100-pc-2*gap);
  const c1=el.querySelector(".g1"), c2=el.querySelector(".g2");
  c1.setAttribute("stroke-dasharray",(pc*RC/100).toFixed(2)+" "+RC.toFixed(2)); c1.style.opacity=pc>0.2?1:0;
  c2.setAttribute("stroke-dasharray",(rest*RC/100).toFixed(2)+" "+RC.toFixed(2)); c2.style.opacity=rest>0.2?1:0;
  c2.setAttribute("transform",`rotate(${(-90+(pc+gap)*3.6).toFixed(2)} 50 50)`);
}
const gauge=(p,key)=>`<svg viewBox="0 0 100 100" data-gauge="${key}" data-to="${p}" aria-hidden="true" focusable="false"><circle class="g2" cx="50" cy="50" r="45"/><circle class="g1" cx="50" cy="50" r="45" transform="rotate(-90 50 50)"/></svg>`;
// numbers only roll when they change (after an update); on a fresh page they show straight away
// 手机：只有打开网站时和数字真的变了才播，来回换页直接显示
function runAnims(root){
  const still=isPh()&&PZSEEN, from0=(k,to)=>MEM.has(k)?MEM.get(k):still?to:0;
  root.querySelectorAll("[data-tk]").forEach(el=>{ const k=el.dataset.tk, to=+el.dataset.to, f=FMT[el.dataset.f||"rm"], up=!MEM.has(k)&&fxOn()&&!still, from=MEM.has(k)?MEM.get(k):up?0:to; MEM.set(k,to); tween(from,to,up?1000:600,v=>{ el.textContent=f(v); }); });
  root.querySelectorAll("[data-left]").forEach(el=>{ const k=el.dataset.left, to=+el.dataset.to, from=from0(k,to); MEM.set(k,to); tween(from,to,800,v=>{ el.style.left=v+"%"; }); });
  root.querySelectorAll("[data-bar]").forEach(el=>{ const k=el.dataset.bar, to=+el.dataset.to, from=from0(k,to); MEM.set(k,to); tween(from,to,650,v=>{ el.style.width=v+"%"; }); });
  root.querySelectorAll("[data-gauge]").forEach(el=>{ const k=el.dataset.gauge, to=+el.dataset.to, from=from0(k,to); MEM.set(k,to); tween(from,to,800,v=>setGauge(el,v)); });
  if(root===document&&root.querySelector("#main [data-tk],#main [data-gauge],#main [data-bar]")) PZSEEN=true;
}
const tk=(key,v,f="rm")=>`<span data-tk="${key}" data-to="${v}" data-f="${f}">${FMT[f](v)}</span>`;

/* ================= chart ================= */
function chartGeo(g,s){
  const W=640,H=250,Lp=68,R=16,T=20,B=30;
  const act=actualSeries(g);
  const endT=Math.max(s.total,act.length?act[act.length-1].t:0);
  const planAt=t=>Math.min(g.target*1.2,fv(g.startAmt,s.plan,s.r,t));
  const planPts=[]; for(let i=0;i<=Math.ceil(endT);i++) planPts.push({t:i,v:planAt(i)});
  const max=Math.max(g.target,...act.map(p=>p.v),...planPts.map(p=>p.v))*1.08||1;
  const x=t=>Lp+(W-Lp-R)*t/Math.max(1,endT), y=v=>T+(H-T-B)*(1-v/max);
  const nowT=Math.min(endT,s.elapsed);
  return {W,H,Lp,R,T,B,act,endT,planAt,planPts,max,x,y,nowT};
}
function progressChart(g,s,noPlan){
  const {W,H,Lp,R,T,B,act,endT,planPts,x,y,nowT}=chartGeo(g,s);
  const path=a=>a.map((p,i)=>(i?"L":"M")+x(p.t).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const actStep=[]; act.forEach((p,i)=>{ if(i) actStep.push({t:p.t,v:act[i-1].v}); actStep.push(p); }); actStep.push({t:nowT,v:act[act.length-1].v});
  const ticks=[0,.25,.5,.75,1].map(f=>g.target*f);
  const xt=[]; const step=[3,6,12,24,60,120,240].find(k=>endT/k<=4)||480; for(let t=0;t<=endT+.01;t+=step) xt.push(t);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="进度图：现在 ${rm(g.saved)}，目标 ${rm(g.target)}。指着图，或按左右键，看每个月的实际和计划">
    <defs><linearGradient id="chArea" gradientUnits="userSpaceOnUse" x1="0" y1="${T}" x2="0" y2="${H-B}"><stop offset="0" style="stop-color:var(--teal);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--teal);stop-opacity:0"/></linearGradient></defs>
    ${ticks.map(v=>`<line class="ch-grid" x1="${Lp}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-ax" x="${Lp-8}" y="${y(v)+4}" text-anchor="end" font-size="12">${rmk(v)}</text>`).join("")}
    ${xt.map(t=>`<text class="ch-ax" x="${x(t)}" y="${H-10}" text-anchor="middle" font-size="12">${ymLabel(addMonthsYM(t,g.start))}</text>`).join("")}
    <line class="ch-now" x1="${x(nowT)}" x2="${x(nowT)}" y1="${T}" y2="${H-B}" stroke-dasharray="2 3"/>
    <text class="ch-nowt" x="${x(nowT)+5}" y="${T+10}" font-size="12">今天</text>
    ${noPlan?"":`<path class="ch-plan" d="${path(planPts)}" fill="none" stroke-width="2" stroke-dasharray="6 5" opacity=".85"/>`}
    <path d="${path(actStep)} L${x(nowT)} ${y(0)} L${x(0)} ${y(0)} Z" fill="url(#chArea)"/>
    <path class="ch-act" d="${path(actStep)}" fill="none" stroke-width="2.5" stroke-linejoin="round"/>
    <circle class="ch-dot" cx="${x(nowT)}" cy="${y(g.saved)}" r="5" stroke-width="2"/>
    <line class="ch-goal" x1="${Lp}" x2="${W-R}" y1="${y(g.target)}" y2="${y(g.target)}" stroke-width="1.5" opacity=".9"/>
    <text class="ch-goalt" x="${W-R}" y="${y(g.target)-7}" text-anchor="end" font-size="12" font-weight="600">目标 ${rm(g.target)}</text>
    <g class="ch-hov" visibility="hidden"><line class="ch-x" y1="${T}" y2="${H-B}"/><circle class="ch-hp" r="4.5"/><circle class="ch-ha" r="5.5"/></g>
    <rect class="ch-hit" x="${Lp}" y="${T}" width="${W-Lp-R}" height="${H-T-B}"/>
  </svg><div class="ch-tip" hidden aria-live="polite"></div>`;
}
// point at the chart (or use ← →) to read one month: actual vs plan
function bindChart(g,s){
  const box=$("#main .chart"), svg=box&&box.querySelector("svg"), tip=box&&box.querySelector(".ch-tip"), hov=svg&&svg.querySelector(".ch-hov"); if(!hov||!tip) return;
  const G=chartGeo(g,s), act=G.act, maxT=Math.max(1,G.endT), FH=g.status==="active"&&flowNow().hasI; // 填了收入：状态照先后顺序算，计划线只是参考
  const actualAt=t=>{ let v=act[0].v; for(const p of act){ if(p.t<=t+1e-6) v=p.v; else break; } return v; };
  let cur=null;
  const show=(t,snap)=>{
    t=Math.max(0,Math.min(maxT,t));
    if(snap) t=Math.abs(t-G.nowT)<.5?G.nowT:Math.max(0,Math.min(maxT,Math.round(t)));
    cur=t;
    const isNow=Math.abs(t-G.nowT)<1e-6, plan=Math.min(g.target,fv(g.startAmt,s.plan,s.r,t)), a=t<=G.nowT+1e-6?(isNow?g.saved:actualAt(t)):null, X=G.x(t).toFixed(1);
    hov.setAttribute("visibility","visible");
    const ln=hov.querySelector(".ch-x"); ln.setAttribute("x1",X); ln.setAttribute("x2",X);
    const hp=hov.querySelector(".ch-hp"); hp.setAttribute("visibility",FH?"hidden":"visible"); hp.setAttribute("cx",X); hp.setAttribute("cy",G.y(G.planAt(t)).toFixed(1));
    const ha=hov.querySelector(".ch-ha"); ha.setAttribute("visibility",a==null?"hidden":"visible"); if(a!=null){ ha.setAttribute("cx",X); ha.setAttribute("cy",G.y(a).toFixed(1)); }
    const d=a==null?null:a-plan, tol=Math.max(50,g.target*.01);
    tip.innerHTML=`<b>${isNow?"今天 · ":""}${ymLabel(isNow?ymAt(new Date(),0):ymAt(g.start,t))}</b>
      ${a!=null?`<div><i style="background:var(--teal)"></i>实际 <span class="num">${rm(a)}</span></div>`:`<div class="dim"><i style="background:var(--line2)"></i>实际：还没到这个月</div>`}
      ${FH?(a==null?"":`<div class="dim">离目标还差 ${rm(Math.max(0,g.target-a))}</div>`):`<div><i style="background:var(--faint)"></i>计划 <span class="num">${rm(plan)}</span></div>`}
      ${FH?"":d==null?`<div class="dim">照计划，离目标还差 ${rm(Math.max(0,g.target-plan))}</div>`:Math.abs(d)<tol?`<div class="gd">跟计划差不多</div>`:d>0?`<div class="gd">比计划多 ${rm(d)}</div>`:`<div class="wn">比计划少 ${rm(-d)}</div>`}`;
    tip.hidden=false;
    const bw=svg.getBoundingClientRect().width, px=X*bw/G.W, tw=tip.offsetWidth;
    tip.style.left=Math.round(px+14+tw>bw?Math.max(0,px-14-tw):px+14)+"px";
  };
  const hide=()=>{ hov.setAttribute("visibility","hidden"); tip.hidden=true; cur=null; };
  const at=e=>{ const r=svg.getBoundingClientRect(); return ((e.clientX-r.left)*G.W/r.width-G.Lp)/(G.W-G.Lp-G.R)*maxT; };
  svg.addEventListener("pointermove",e=>show(at(e),true));
  svg.addEventListener("pointerdown",e=>show(at(e),true));
  svg.addEventListener("pointerleave",e=>{ if(e.pointerType==="mouse") hide(); });
  svg.addEventListener("focus",()=>show(G.nowT));
  svg.addEventListener("blur",hide);
  svg.addEventListener("keydown",e=>{ const k=e.key; if(!["ArrowLeft","ArrowRight","Home","End","Escape"].includes(k)) return; e.preventDefault();
    if(k==="Escape"){ hide(); return; } const c=cur==null?G.nowT:cur, st=e.shiftKey?12:1, whole=Math.abs(c-Math.round(c))<1e-6;
    show(k==="Home"?0:k==="End"?maxT:k==="ArrowRight"?(whole?Math.round(c)+st:Math.ceil(c)+st-1):(whole?Math.round(c)-st:Math.floor(c)-st+1)); });
}

/* ================= 问 Brader：「理财随便问」的回答方法 =================
   只搬回答的部分：没有开场白、念问题、学习大会 CTA、片尾、小红书标题和封面。
   每题同一个套路（照「理财随便问 · 风格补充」）：接住问题 → 一个工具（公式 / 对照表 / 两个选择比一比）
   → 用你的数字现场算一遍 → 看你的情况（最多一个分叉）→ 把想法翻过来 → 「所以……」一句照做的结论。
   回报假设：股票长期 10%、通胀调整后 7%、FD 3%、EPF 5.5%、通胀 4%（都是假设情景，不是保证）。 */

const B=(v,a)=>`<b class="n">${rm(a?nice(v):v)}</b>`;          // a: 投资、通胀推算出来的数字，取个整数（前面写「大约」）
const KB=(v,a)=>`<b class="n kn">${rm(a?nice(v):v)}</b>`;      // 这一题最要记住的数字
const pc=v=>Math.round(v*100)+"%";
const PB=v=>`<b class="n">${pc(v)}</b>`;
const tTable=(head,rows,hl)=>`<div class="tscroll"><table class="ttab"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>`<tr${i===hl?' class="hl"':""}>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const tSteps=(a,hl)=>`<ol class="tsteps">${a.map((x,i)=>`<li${i===hl?' class="hl"':""}>${x}</li>`).join("")}</ol>`;
const tFml=s=>`<div class="fml">${s}</div>`;
const tNote=s=>`<p class="tnote">${s}</p>`;
const magicMul=last=>{ const q=(1+INFL)/1.06; return (1-Math.pow(q,last))/(1-q); };   // 跟「退休」目标同一个 Magic Number：6% 回报、4% 通胀
const payoffN=(b,mi,pay)=>pay<=b*mi?Infinity:mi===0?Math.ceil(b/pay):Math.ceil(-Math.log(1-mi*b/pay)/Math.log(1+mi));

     :[`你现有的月供 ${B(c.D)}，已经用掉净收入 ${PB(c.D/c.I)}，再加房贷就超过 35%。`],

{id:"rent",cat:"carhouse",needs:"",q:"租房还是买房，哪一个比较划算？",kw:"租房 买房 租金 7% 法则 划算 rent 帮别人供房",rel:["house","carhouse","flexi"],
 params:[{k:"p",l:"房价",u:"RM",d:()=>500000,min:1},{k:"rent",l:"同区同类型的月租",u:"RM",d:()=>1800}],
 ans:(c,P)=>{ const yrc=P.p*.07, mo=yrc/12, buy=P.rent>=mo;
  return {open:"老一辈说：「租房只是帮别人供房。」真的是这样吗？用一个很简单的算式就知道。",
   tool:{t:"7% 法则：房价 × 7% = 一年的拥有成本",h:tTable(["拥有成本包括","大约"],[["维修","1.5%"],["管理费和 property tax","1%"],["资金成本（首期失去的投资机会 + 银行利息）","4.5%"]],-1)},
   calc:[`${rm(P.p)} × 7% = 每年 ${B(yrc)}，大约每个月 ${KB(mo,1)}。同区的租金是 ${B(P.rent)}，${buy?"比这个高，买比较划算":"低过这个，租比较划算"}。`],
   fork:"还有一个问题要先问自己：你打算住多久？少过十年，买房的进场成本很难赚回来。",

   acts:buy?[{l:"把这个变成目标",pri:1,goal:1,f:()=>openAdd(`五年后买 RM${Math.round(P.p/1000)}k 的房`)}]:[]}; }},
{id:"carhouse",cat:"carhouse",needs:"I",q:"我应该先买车，还是先买房？",kw:"先买车 先买房 车 房 同时 顺序 车贷 房贷",rel:["car","house","dsr"],

   calc:[`以你的净收入 ${B(c.I)}：车贷照 15% 是 ${B(car)}，房贷照 30% 是 ${B(house)}${c.D>0?`，加上现有月供 ${B(c.D)}`:""}。同时供的话，DSR 就到 ${PB(both)}，超过 35%。`],
   fork:`很多年轻人用「能负担多少 installment」来选车，结果买了太贵的车。最好的规划：先买一辆低过年薪（${rm(c.I*12)}）的车，供五年。`,

{id:"retire",cat:"retire",needs:"",q:"我想早一点退休，要存多少钱才够？",kw:"退休 retire 退休金 magic number 4% 法则 财务自由 几岁退休 提早退休",rel:["epf","million","start"],
 params:[{k:"ra",l:"想几岁退休",u:"岁",d:()=>60,min:20,max:79,step:1},{k:"sp",l:"退休后每月花（今天的钱）",u:"RM",d:c=>c.hasE?Math.round(c.E/100)*100:4000,min:1}],
 ans:(c,P)=>{ const ra=P.ra, yrs=ra-c.A, last=80-ra, mul=magicMul(last), fut=P.sp*Math.pow(1+INFL,Math.max(0,yrs)), need=fut*12*mul, mon=yrs>0?pmtFor(need,0,mrate(.10),yrs*12):0;
  return {open:"退休要多少钱，不是看别人，是看你自己退休后每个月要花多少。",
   tool:{t:"公式：年开销 ÷ Magic Number = 退休需要的钱",h:tFml("年开销 ÷ Magic Number = 退休需要的钱")+tNote("Magic Number 看你要撑多少年：撑三十三年用 4%（6% 回报、4% 通胀），只要撑二十年用 6%。比如说每月花 RM5,000，一年 RM60,000 ÷ 4% = RM1.5 million。")},
   calc:yrs<=0?[`你今年 ${c.A} 岁，已经到了这个年龄。把上面的退休年龄改大一点再算。`]
     :[`你今年 ${c.A} 岁，想 ${ra} 岁退休、花到 80 岁，要撑 ${last} 年。今天每月 ${rm(P.sp)}，加了通胀，到时是每月 ${B(fut,1)}。一年 ${rm(nice(fut*12))} ÷ ${(100/mul).toFixed(1)}% = 大约 ${KB(need,1)}。`,`从今天开始，每个月投资 ${B(mon,1)}（假设回报 10%），${yrs} 年后就到这个数字。`],
   fork:"这还没有减掉 EPF。EPF 到时会有的钱，可以抵掉一部分，看「光靠 EPF 够我退休吗」那一题。",
   re:"你是很难靠存钱的方式去累积到这笔钱的，你一定要靠投资。",
   so:"所以，先算出你自己的数字，减掉 EPF 到时会有的钱，差额每个月自动投资。",
   acts:yrs>0?[{l:"把这个变成目标",pri:1,goal:1,f:()=>openAdd(`${ra}岁退休 每月花 RM${P.sp}`)}]:[]}; }},
{id:"epf",cat:"retire",needs:"I",q:"光靠 EPF，够我退休吗？",kw:"EPF KWSP 公积金 够不够 退休 缺口 shortfall i-akaun",rel:["retire","start","million"],
 params:[{k:"bal",l:"EPF 现在有",u:"RM",d:()=>0},{k:"gross",l:"月薪（扣 EPF 之前）",u:"RM",d:c=>Math.round(c.I/.8/100)*100,min:1,hint:"先用净收入粗估，可以改"},{k:"sp",l:"退休后每月花（今天的钱）",u:"RM",d:c=>c.hasE?Math.round(c.E/100)*100:4000,min:1}],
 ans:(c,P)=>{ const yrs=60-c.A, n=Math.max(0,yrs)*12, epf=fv(P.bal,P.gross*.23,mrate(.055),n), need=P.sp*Math.pow(1+INFL,Math.max(0,yrs))*12*magicMul(20), gap=Math.max(0,need-epf), mon=n>0?pmtFor(gap,0,mrate(.10),n):0, ten=c.I*.1;
  return {open:"EPF 是我们退休的基础，但是光靠 EPF 是不够的。我们分三步来算。",
   tool:{t:"公式：需要多少 − EPF 会有多少 = 还差多少",h:tFml("退休需要的钱 − EPF 到时会有的钱 = 退休缺口")},
   calc:yrs<=0?[`你今年 ${c.A} 岁，已经过了 60 岁。这一题是给还在工作、还在供 EPF 的人算的。`]
     :[`60 岁退休、花到 80 岁，每月花今天的 ${rm(P.sp)}，大约要 ${B(need,1)}。`,`EPF 现在 ${rm(P.bal)}，月薪 ${rm(P.gross)}，每月供 23%（11% + 12%），5.5% 回报，用薪水不加的保守算法，${yrs} 年后大约有 ${B(epf,1)}。`,
       gap>0?`还差 ${KB(gap,1)}，每个月要另外投资 ${B(mon,1)}（假设回报 10%）。`:"EPF 就够了。"],
   fork:"而且这还是最理想的情况：从来没丢工作、老板每个月都有供、中途没有提出来。",
   re:"很多人以为有 EPF 就够了。EPF 是 balanced portfolio，只能稳稳赚 5% 到 6%，因为它服务几百万人，不能大起大落；你离退休还有很多年，应该把长期回报拉高。",
   so:gap>0?`所以，每个月额外抽薪水 10%（${rm(ten)}）做退休投资，从 ETF 开始${mon>ten?`；你要的是 ${rm(nice(mon))}，比 10% 多，每次加薪就把一半加进去`:""}。`:"所以，继续让 EPF 帮你存，多出来的钱再去投资，退休会过得更舒服。",
   acts:yrs>0&&gap>0?[{l:"把缺口变成目标",pri:1,goal:1,f:()=>openAdd(`60岁退休 每月花 RM${P.sp}`,{name:"退休缺口",target:gap,how:"问 Brader 算的：退休需要的钱，减掉 EPF 到时大约会有的钱"})}]:[]}; }},
{id:"edu",cat:"family",needs:"",q:"孩子的大学教育金，我要存多少？",kw:"孩子 教育金 大学 学费 读书 SSPN 留学 小孩",rel:["retire","tax","couple"],
 params:[{k:"age",l:"孩子现在几岁",u:"岁",d:()=>5,max:18,step:1},{k:"per",l:"一年学费和生活费（今天的钱）",u:"RM",d:()=>50000,min:1},{k:"yrs",l:"读几年",u:"年",d:()=>4,min:1,max:8,step:1}],
 ans:(c,P)=>{ const wait=Math.max(1,19-P.age); let tot=0; for(let i=0;i<P.yrs;i++) tot+=P.per*Math.pow(1+INFL,wait+i);
  const n=wait*12, now=pmtFor(tot,0,mrate(.10),n), late=wait>5?pmtFor(tot,0,mrate(.10),n-60):0;
  return {open:"孩子教育金，越早开始越轻松，越迟开始越痛苦。",
   tool:{t:"公式：一年的费用 × 读几年，再算通胀 4%",h:tFml("一年学费和生活费 × 读几年（每年加通胀 4%）")+tNote("先上 studymalaysia.com 查清楚学费。参考（2024）：本地大学读 business，一年大约 RM45,000。")},
   calc:[`孩子 ${P.age} 岁，19 岁入学，还有 ${wait} 年。一年 ${rm(P.per)}、读 ${P.yrs} 年，加了通胀，一共大约 ${KB(tot,1)}。现在开始，每个月投资 ${B(now,1)}（假设回报 10%）就够。`],

   so:`所以，先顾好自己的退休，再开一个教育金户口，每个月自动投资 ${rm(nice(now))}；SSPN 一年存满 RM8,000 还可以扣税。`,
   acts:[{l:"把这个变成目标",pri:1,goal:1,f:()=>openAdd("孩子以后读大学",{name:"孩子教育金",target:tot,months:n,how:`问 Brader 算的：孩子 ${P.age} 岁、19 岁入学，一年 ${rm(P.per)} × ${P.yrs} 年，通胀 4%`})}]}; }},
{id:"order",cat:"plan",needs:"IE",q:"我有好几个目标，应该先存哪一个？",kw:"先后 顺序 几个目标 先存哪个 九大阶梯 优先 太多目标",rel:["ef","card","split"],
 ans:c=>{ const act=activeSorted(), st=act.map(g=>stat(g)), monthly=act.reduce((a,g,i)=>a+planM(g,st[i]),0), hasEF=c.efGoals.length>0, efOk=efFull();
  const ef=c.efGoals.find(g=>g.status==="active"), over=c.hasI&&c.hasE&&monthly>c.sur&&act.length>=2;
  const FL=flowNow(), LT=FL.hasI?FL.items.filter(x=>lateOf(x)>=1):[], lt=LT[0], ltd=lt?lateOf(lt):0, ltTxt=lt?`「${esc(lt.g.name)}」${LT.length>1?`等 ${LT.length} 个目标`:""}${ltd===Infinity?"会存不够":`会晚 ${durTxt(ltd)}`}`:"";
  return {open:"每一个 step 都有它的位置和顺序，不能乱跳，跳了后面就会出现问题。",
   tool:{t:"Brader 的理财九大阶梯",h:tSteps(["存三到六个月的救命钱，放 MMF","还清超过 8% 利息的债","买保险：medical card；有家庭再加人寿和意外","投资前先用满扣税额（PRS、SSPN、EPF 自愿供款）","抽薪水 10% 做退休投资，从 ETF 开始","孩子教育金","投资比例从 10% 慢慢提高到 25%","退休前还清房贷以外的债","做好传承：遗嘱、信托"],efOk?-1:0)},
   calc:[act.length?`你现在有 ${act.length} 个目标进行中，每个月一共要存 ${B(monthly)}${c.hasI&&c.hasE?`，你的每月盈余是 ${B(c.sur)}`:""}。`:"你现在还没有进行中的目标。"],
   fork:!hasEF?"你还没有「救命的钱」这个目标。它是第一步，还没存够之前，投资、买房买车都先放一边。"
     :!efOk&&ef?`你的救命的钱还没存满（${rm(ef.saved)} / ${rm(ef.target)}）。它排第一：每个月先分给它，剩下的才分给其他目标。`
     :over?`所有目标每个月要 ${rm(monthly)}，超出盈余 ${B(monthly-c.sur)}。${lt?`照你排的先后，${ltTxt}。可以把它的期限延后，或者在「我的目标」把它拖到前面。`:"照你排的先后，排后面的这个月分得比较少，前面的存完以后钱会转过去。"}`
     :"救命的钱已经存满，其他目标照你在「我的目标」排的先后：排前面的先拿够每个月的钱。",
   re:"很多人一开始就急着投资、买车，结果一生病、车坏，就要在亏损的时候被逼卖掉投资。",
   so:!hasEF?"所以，第一件事是建立救命的钱。":!efOk?"所以，救命的钱排第一，每个月先分给它；存满以后，它的钱会转给其他目标。":over?(lt?`所以，${ltTxt}，先决定要延后它，还是把更重要的拖到前面。`:"所以，目标太多就要取舍：不急的可以延后，或者想办法提高收入。"):"所以，照九大阶梯的顺序走，每个月更新一次进度。",
   acts:!hasEF?[{l:"建立救命的钱",pri:1,f:()=>openAdd("存够救命的钱")}]:!efOk&&ef?[{l:"查看我的救命的钱",f:()=>go("goal",ef.id)}]:over&&lt?[{l:"查看「"+(lt.g.name.length>10?lt.g.name.slice(0,10)+"…":lt.g.name)+"」",f:()=>go("goal",lt.id)},{l:"去排先后",f:()=>go("goals")}]:[{l:"看我的目标",f:()=>go("goals")}]}; }},
{id:"worth",cat:"plan",needs:"I",q:"以我的年龄和收入，应该要有多少钱才算财务健康？",kw:"财务健康 达标 几倍 年收入 年龄 净资产 落后 多少钱 应该有",rel:["start","retire","split"],
